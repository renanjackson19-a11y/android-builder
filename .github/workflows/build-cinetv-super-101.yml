name: Build CineTV Super 1.0.1

on:
  push:
    paths:
      - '.github/workflows/build-cinetv-super-101.yml'
      - 'inspection/patch_cinetv_super_101.py'

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Download CineTV Super 1.0.0 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work out
          mkdir -p work out
          curl -fsSL --retry 4 -o /tmp/cinetv-100.zip https://raw.githubusercontent.com/renanjackson19-a11y/android-builder/main/releases/CineTV_Super_Android_Nativo_1_0_0_FONTE.zip
          unzip -q /tmp/cinetv-100.zip -d work
          python3 inspection/patch_cinetv_super_101.py
          grep -q "applicationId 'site.clickaqui.cinetv'" work/app/build.gradle
          grep -q "versionName '1.0.1'" work/app/build.gradle
          grep -q 'X-CineTV-Super-Key' work/app/src/main/java/fun/greenplay/app/Api.java
          ! grep -q 'X-CineTV Super-Key' work/app/src/main/java/fun/greenplay/app/Api.java

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Compile CineTV Super APK
        run: cd work && gradle assembleDebug --stacktrace --no-daemon

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          cp work/app/build/outputs/apk/debug/app-debug.apk out/CineTV_Super_1.0.1.apk
          (cd work && zip -qr ../out/CineTV_Super_Android_Nativo_1_0_1_FONTE.zip . -x '.gradle/*' 'app/build/*' 'build/*')
          unzip -t out/CineTV_Super_Android_Nativo_1_0_1_FONTE.zip >/dev/null
          sha256sum out/*

      - name: Publish build files in repository
        shell: bash
        run: |
          set -euo pipefail
          cp out/CineTV_Super_1.0.1.apk releases/
          cp out/CineTV_Super_Android_Nativo_1_0_1_FONTE.zip releases/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/CineTV_Super_1.0.1.apk releases/CineTV_Super_Android_Nativo_1_0_1_FONTE.zip
          git commit -m "Publish CineTV Super 1.0.1" || true
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: CineTV-Super-1.0.1
          path: out/*
          if-no-files-found: error
          retention-days: 30
