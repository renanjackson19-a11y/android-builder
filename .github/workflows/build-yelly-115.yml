name: Build Yelly Doramas 1.0.15

on:
  push:
    paths:
      - '.github/workflows/build-yelly-115.yml'
      - 'inspection/StoriesActivity_115.java.gz.b64'
      - 'inspection/story_banner_bg_114.jpg'
      - 'inspection/patch_yelly_115_native_stories.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Download Yelly 1.0.14 source
        uses: actions/download-artifact@v4
        with:
          name: Yelly-Doramas-1.0.14
          path: base_artifact
          github-token: ${{ github.token }}
          run-id: 36095420695

      - name: Apply Yelly 1.0.15 native Stories
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work out
          mkdir -p work out
          unzip -q base_artifact/Yelly_Doramas_Android_Nativo_1_0_14.zip -d work
          base64 -d inspection/StoriesActivity_115.java.gz.b64 | gunzip > work/app/src/main/java/fun/greenplay/app/StoriesActivity.java
          cp inspection/story_banner_bg_114.jpg work/app/src/main/res/drawable-nodpi/story_banner_bg.jpg
          python3 inspection/patch_yelly_115_native_stories.py
          grep -q "versionName '1.0.15'" work/app/build.gradle
          grep -q 'ExoPlayer' work/app/src/main/java/fun/greenplay/app/StoriesActivity.java
          grep -q 'content_detail' work/app/src/main/java/fun/greenplay/app/StoriesActivity.java
          grep -q 'PlayerActivity.class' work/app/src/main/java/fun/greenplay/app/StoriesActivity.java
          grep -q 'PREVIEW_MS=120000L' work/app/src/main/java/fun/greenplay/app/StoriesActivity.java
          grep -q 'story_banner_bg' work/app/src/main/java/fun/greenplay/app/StoriesActivity.java
          grep -q 'movieBackdrop' work/app/src/main/java/fun/greenplay/app/PlayerActivity.java
          if grep -q 'youtube.com' work/app/src/main/java/fun/greenplay/app/StoriesActivity.java; then exit 1; fi
          if grep -q 'YouTubePlayerActivity' work/app/src/main/java/fun/greenplay/app/StoriesActivity.java; then exit 1; fi
          if grep -q 'WebView' work/app/src/main/java/fun/greenplay/app/StoriesActivity.java; then exit 1; fi
          if grep -q 'iframe' work/app/src/main/java/fun/greenplay/app/StoriesActivity.java; then exit 1; fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Compile Yelly
        run: cd work && gradle assembleDebug --stacktrace --no-daemon

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          cp work/app/build/outputs/apk/debug/app-debug.apk out/Yelly_Doramas_1.0.15.apk
          (cd work && zip -qr ../out/Yelly_Doramas_Android_Nativo_1_0_15.zip . -x '.gradle/*' 'app/build/*' 'build/*')
          unzip -t out/Yelly_Doramas_Android_Nativo_1_0_15.zip >/dev/null
          sha256sum out/*

      - uses: actions/upload-artifact@v4
        with:
          name: Yelly-Doramas-1.0.15
          path: out/*
          if-no-files-found: error
          retention-days: 30
