name: Build Yelly Doramas 1.0.45
on:
  push:
    paths:
      - '.github/workflows/build-yelly-145.yml'
      - 'inspection/patch_yelly_145_logo_pink_only.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
      - name: Download 1.0.44 source
        uses: actions/download-artifact@v4
        with:
          name: Yelly-Doramas-1.0.44
          path: base_artifact
          github-token: ${{ github.token }}
          run-id: 36181376611
      - name: Apply logo and accent only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work out && mkdir -p work out
          unzip -q base_artifact/Yelly_Doramas_Android_Nativo_1_0_44.zip -d work
          cat inspection/yelly_logo_tiny_00.b64 inspection/yelly_logo_tiny_01.b64 inspection/yelly_logo_tiny_02.b64 inspection/yelly_logo_tiny_03.b64 inspection/yelly_logo_tiny_04.b64 | tr -d '\\n\\r ' | base64 -d > work/app/src/main/res/drawable/yelly_logo_header.webp
          python3 inspection/patch_yelly_145_logo_pink_only.py
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9', cache-disabled: true}
      - name: Compile
        run: cd work && gradle assembleDebug --stacktrace --no-daemon
      - name: Package
        shell: bash
        run: |
          cp work/app/build/outputs/apk/debug/app-debug.apk out/Yelly_Doramas_1.0.45.apk
          (cd work && zip -qr ../out/Yelly_Doramas_Android_Nativo_1_0_45.zip . -x '.gradle/*' 'app/build/*' 'build/*')
      - uses: actions/upload-artifact@v4
        with:
          name: Yelly-Doramas-1.0.45
          path: out/*
          retention-days: 30
