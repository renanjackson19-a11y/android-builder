name: Build Yelly Doramas 1.0.16

on:
  push:
    paths:
      - '.github/workflows/build-yelly-116.yml'
      - 'inspection/patch_yelly_116_miniseries_no_youtube.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Download Yelly 1.0.15 source
        uses: actions/download-artifact@v4
        with:
          name: Yelly-Doramas-1.0.15
          path: base_artifact
          github-token: ${{ github.token }}
          run-id: 36097059620

      - name: Apply Yelly 1.0.16 fixes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work out
          mkdir -p work out
          unzip -q base_artifact/Yelly_Doramas_Android_Nativo_1_0_15.zip -d work
          python3 inspection/patch_yelly_116_miniseries_no_youtube.py

          grep -q "versionName '1.0.16'" work/app/build.gradle
          grep -q 'Api.post("greenshorts"' work/app/src/main/java/fun/greenplay/app/StoriesActivity.java
          grep -q 'Api.post("dorama_enrich"' work/app/src/main/java/fun/greenplay/app/StoriesActivity.java
          grep -q 'story_banner_bg' work/app/src/main/java/fun/greenplay/app/StoriesActivity.java
          grep -q 'fitStoryVideo' work/app/src/main/java/fun/greenplay/app/StoriesActivity.java
          grep -q 'fitPortraitVideo' work/app/src/main/java/fun/greenplay/app/PlayerActivity.java
          grep -q 'movieBackdrop' work/app/src/main/java/fun/greenplay/app/PlayerActivity.java

          if grep -q 'Api.post("get_category"' work/app/src/main/java/fun/greenplay/app/StoriesActivity.java; then
            echo "Stories still using GreenPlay movie categories"; exit 1
          fi
          if grep -q 'new Intent(this,YouTubePlayerActivity.class)' work/app/src/main/java/fun/greenplay/app/MainActivity.java; then
            echo "Catalog still launches YouTubePlayerActivity"; exit 1
          fi
          if grep -q 'android:name=".YouTubePlayerActivity"' work/app/src/main/AndroidManifest.xml; then
            echo "YouTube player still registered"; exit 1
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Compile Yelly
        run: cd work && gradle assembleDebug --stacktrace --no-daemon

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          cp work/app/build/outputs/apk/debug/app-debug.apk out/Yelly_Doramas_1.0.16.apk
          (cd work && zip -qr ../out/Yelly_Doramas_Android_Nativo_1_0_16.zip . -x '.gradle/*' 'app/build/*' 'build/*')
          unzip -t out/Yelly_Doramas_Android_Nativo_1_0_16.zip >/dev/null
          sha256sum out/*

      - uses: actions/upload-artifact@v4
        with:
          name: Yelly-Doramas-1.0.16
          path: out/*
          if-no-files-found: error
          retention-days: 30
