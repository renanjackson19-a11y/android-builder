name: Build GreenPlay 5.28.70 Exact Provider Counts

on:
  push:
    paths:
      - '.github/workflows/build-greenplay-52870-exact-provider-counts.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
      - name: Download 5.28.69 source
        uses: actions/download-artifact@v4
        with:
          name: GreenPlay-5.28.69-trial-tv-visibility
          path: base_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35827249827
      - name: Patch source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work && mkdir work
          unzip -q base_artifact/GreenPlay_Android_Nativo_5_28_52869_TRIAL_TV_VISIBILITY.zip -d work
          python3 inspection/patch52870_exact_provider_counts.py
          grep -q 'versionCode 52870' work/app/build.gradle
          grep -q 'syncCurrentProviderCounts' work/app/src/main/java/fun/greenplay/app/MainActivity.java
          ! grep -q 'if(live<=0){int c=cachedProviderCap' work/app/src/main/java/fun/greenplay/app/MainActivity.java
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Compile APK
        run: cd work && gradle assembleDebug --stacktrace --no-daemon
      - name: Package output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp work/app/build/outputs/apk/debug/app-debug.apk out/GreenPlay_5.28.70-debug.apk
          (cd work && zip -qr ../out/GreenPlay_Android_Nativo_5_28_52870_EXACT_PROVIDER_COUNTS.zip . -x '.gradle/*' 'app/build/*' 'build/*')
          unzip -t out/GreenPlay_Android_Nativo_5_28_52870_EXACT_PROVIDER_COUNTS.zip >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: GreenPlay-5.28.70-exact-provider-counts
          path: out/*
          if-no-files-found: error
          retention-days: 30
