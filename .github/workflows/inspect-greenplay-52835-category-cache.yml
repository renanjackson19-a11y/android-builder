name: Inspect GreenPlay 5.28.35 Category Cache

on:
  push:
    paths:
      - '.github/workflows/inspect-greenplay-52835-category-cache.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 \
            https://raw.githubusercontent.com/renanjackson19-a11y/android-builder/283c31cdd617927296397d01a10ed785e85220ab/uploads/project-20260922-020307-c4ac1a.zip \
            -o /tmp/p.zip
          rm -rf work && mkdir work
          unzip -q /tmp/p.zip -d work
          F=work/app/src/main/java/fun/greenplay/app/MainActivity.java
          echo '===== CATEGORY CACHE METHODS ====='
          grep -nE "storeFullCategoryInHomeCache|readHomeCache|saveHomeCache|persistHomeCacheAsync|persistentHomeFile|homeCacheKey|categoryPageArgs|fetchAllCategoryPages|openSection|mobileCategory" "$F" | head -n 260
          echo '===== CACHE BLOCK ====='
          sed -n '400,620p' "$F"
          echo '===== CATEGORY BLOCK ====='
          sed -n '1110,1175p' "$F"
          sed -n '1530,1585p' "$F"
          echo '===== BUILD ====='
          cat work/app/build.gradle | grep -E "versionCode|versionName"
