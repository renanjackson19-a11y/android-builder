name: Inspect GreenPlay 5.28.70 Security Storage

on:
  push:
    paths:
      - '.github/workflows/inspect-greenplay-52870-security-storage.yml'

permissions:
  contents: write
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GreenPlay-5.28.70-exact-provider-counts
          path: base_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35829657433
      - shell: bash
        run: |
          set -euo pipefail
          rm -rf work && mkdir work
          unzip -q base_artifact/GreenPlay_Android_Nativo_5_28_52870_EXACT_PROVIDER_COUNTS.zip -d work
          {
            echo '=== BUILD GRADLE ==='
            cat work/app/build.gradle
            echo '=== MANIFEST ==='
            cat work/app/src/main/AndroidManifest.xml
            echo '=== PROGUARD ==='
            cat work/app/proguard-rules.pro 2>/dev/null || true
            echo '=== API ==='
            nl -ba work/app/src/main/java/fun/greenplay/app/Api.java 2>/dev/null || true
            echo '=== OFFLINE SERVICE ==='
            nl -ba work/app/src/main/java/fun/greenplay/app/OfflineDownloadService.java 2>/dev/null || true
            echo '=== CACHE METHODS ==='
            grep -n -A45 -B20 -E 'readHomeCache|writeHomeCache|saveHomeCache|homeCache|catalogCache|write.*Cache|putString\(' work/app/src/main/java/fun/greenplay/app/MainActivity.java | head -n 1200 || true
            echo '=== SENSITIVE STORAGE ==='
            grep -RIn -E 'source_url|source_urls|password|senha|username|servidor_iptv|video_320|video_url|stream_url|getSharedPreferences|putString\(' work/app/src/main/java/fun/greenplay/app | head -n 1600 || true
            echo '=== LOGGING DEBUG WEBVIEW ==='
            grep -RIn -E 'android\.util\.Log|Log\.|System\.(out|err)|printStackTrace|HttpLoggingInterceptor|WebView|setWebContentsDebuggingEnabled|debuggable|StrictMode' work/app/src/main work/app/build.gradle | head -n 1000 || true
          } > inspection/security_storage_52870.txt
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add inspection/security_storage_52870.txt
          git commit -m "Inspect security storage 5.28.70" || exit 0
          git push
