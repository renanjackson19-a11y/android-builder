name: Build GreenPlay 5.28.57 GreenShorts TV Player

on:
  push:
    paths:
      - '.github/workflows/build-greenplay-52857-greenshorts-tv-player.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
      - name: Download 5.28.56 source
        uses: actions/download-artifact@v4
        with:
          name: GreenPlay-5.28.56-greenshorts-fullwidth
          path: base_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35795313566
      - name: Patch source
        shell: bash
        run: |
          set -euo pipefail
          mkdir work
          unzip -q base_artifact/GreenPlay_Android_Nativo_5_28_52856_GREENSHORTS_FULLWIDTH.zip -d work
          python3 inspection/patch52857_greenshorts_tv_player_loading_icons.py
          grep -q 'versionCode 52857' work/app/build.gradle
          grep -q 'fetchYoutubeShortsTvProgressive' work/app/src/main/java/fun/greenplay/app/MainActivity.java
          grep -q 'putExtra("tv_mode",tvMode)' work/app/src/main/java/fun/greenplay/app/MainActivity.java
          grep -q 'SCREEN_ORIENTATION_SENSOR_LANDSCAPE' work/app/src/main/java/fun/greenplay/app/YouTubePlayerActivity.java
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Compile APK
        run: cd work && gradle assembleDebug --stacktrace --no-daemon
      - name: Package output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp work/app/build/outputs/apk/debug/app-debug.apk out/GreenPlay_5.28.57-debug.apk
          (cd work && zip -qr ../out/GreenPlay_Android_Nativo_5_28_52857_GREENSHORTS_TV_PLAYER.zip . -x '.gradle/*' 'app/build/*' 'build/*')
          unzip -t out/GreenPlay_Android_Nativo_5_28_52857_GREENSHORTS_TV_PLAYER.zip >/dev/null
          sha256sum out/GreenPlay_5.28.57-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GreenPlay-5.28.57-greenshorts-tv-player
          path: out/*
          if-no-files-found: error
          retention-days: 30
