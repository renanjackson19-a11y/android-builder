name: Build GreenPlay 5.28.72 Safe APK Hardening

on:
  push:
    paths:
      - '.github/workflows/build-greenplay-52872-safe-apk-hardening.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Download exact GreenPlay 5.28.70 source
        uses: actions/download-artifact@v4
        with:
          name: GreenPlay-5.28.70-exact-provider-counts
          path: base_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35829657433

      - name: Patch only APK-side protections
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work out apkcheck
          mkdir -p work out
          unzip -q base_artifact/GreenPlay_Android_Nativo_5_28_52870_EXACT_PROVIDER_COUNTS.zip -d work
          python3 inspection/patch52872_safe_apk_hardening.py

          grep -q 'versionCode 52872' work/app/build.gradle
          grep -q "versionName '5.28.72'" work/app/build.gradle
          grep -q 'debuggable false' work/app/build.gradle
          grep -q 'minifyEnabled true' work/app/build.gradle
          grep -q 'networkSecurityConfig="@xml/network_security_config"' work/app/src/main/AndroidManifest.xml
          grep -q 'SecretStore.encrypt' work/app/src/main/java/fun/greenplay/app/MainActivity.java
          grep -q 'WebView.setWebContentsDebuggingEnabled(false)' work/app/src/main/java/fun/greenplay/app/SecurityGuard.java

          ! grep -RIn '454946ee403e82a9657eafc76091ccb6d8ccd4a8fadfca45' work/app/src/main work/app/proguard-rules.pro
          ! grep -RInE 'NetworkCapabilities.TRANSPORT_VPN|TYPE_VPN|PCAPdroid|NetGuard|greenplay-media-proxy|/media/p/' work/app/src/main/java work/app/src/main/res
          ! grep -RInE 'android\.util\.Log\.|System\.(out|err)|printStackTrace' work/app/src/main/java/fun/greenplay/app

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Compile protected APK
        run: cd work && gradle assembleDebug --stacktrace --no-daemon

      - name: Verify compiled APK
        shell: bash
        run: |
          set -euo pipefail
          APK=work/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          mkdir -p apkcheck
          unzip -q "$APK" 'classes*.dex' -d apkcheck
          if find apkcheck -name 'classes*.dex' -print0 | xargs -0 strings -a | grep -Fq '454946ee403e82a9657eafc76091ccb6d8ccd4a8fadfca45'; then
            echo 'Plain API token leaked into DEX' >&2
            exit 1
          fi
          if find apkcheck -name 'classes*.dex' -print0 | xargs -0 strings -a | grep -Eqi 'cdmainpainelxy\.xyz|rialso\.xyz|zjo\.lat|vizzion\.space'; then
            echo 'Known provider origin leaked into DEX' >&2
            exit 1
          fi
          if command -v apkanalyzer >/dev/null 2>&1; then
            apkanalyzer manifest debuggable "$APK" | tee /tmp/debuggable.txt
            ! grep -qi '^true$' /tmp/debuggable.txt
          fi

      - name: Package output
        shell: bash
        run: |
          set -euo pipefail
          cp work/app/build/outputs/apk/debug/app-debug.apk out/GreenPlay_5.28.72-PROTECTED.apk
          (cd work && zip -qr ../out/GreenPlay_Android_Nativo_5_28_52872_APK_HARDENED.zip . -x '.gradle/*' 'app/build/*' 'build/*')
          unzip -t out/GreenPlay_Android_Nativo_5_28_52872_APK_HARDENED.zip >/dev/null
          sha256sum out/*

      - uses: actions/upload-artifact@v4
        with:
          name: GreenPlay-5.28.72-safe-apk-hardening
          path: out/*
          if-no-files-found: error
          retention-days: 30

# retry after patch-anchor fix
