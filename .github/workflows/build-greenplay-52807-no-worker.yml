name: Build GreenPlay 5.28.7 No Worker

on:
  push:
    paths:
      - .github/workflows/build-greenplay-52807-no-worker.yml

permissions:
  contents: write

jobs:
  build_source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract 5.28.5
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/gp52807
          mkdir -p /tmp/gp52807 releases
          unzip -q uploads/project-20260921-123651-7e8342.zip -d /tmp/gp52807
          MAIN="$(find /tmp/gp52807 -type f -path '*/app/src/main/java/fun/greenplay/app/MainActivity.java' | head -n1)"
          GRADLE="$(find /tmp/gp52807 -type f -path '*/app/build.gradle' | head -n1)"
          test -n "$MAIN"
          test -n "$GRADLE"
          echo "$MAIN" > /tmp/gp_main_path
          echo "$GRADLE" > /tmp/gp_gradle_path

      - name: Apply no-worker cover fix
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/patch_greenplay_52807.py "$(cat /tmp/gp_main_path)" "$(cat /tmp/gp_gradle_path)"

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          MAIN="$(cat /tmp/gp_main_path)"
          GRADLE="$(cat /tmp/gp_gradle_path)"
          grep -n "versionCode 52807" "$GRADLE"
          grep -n "versionName '5.28.7'" "$GRADLE"
          if grep -n 'Api.post("content_enrich"' "$MAIN"; then exit 1; fi
          grep -n 'catalog52807_' "$MAIN"
          grep -n 'warmHomeImages(snapshot,catalogReady);' "$MAIN"
          grep -n 'void ensureTmdbCardArtwork' "$MAIN"

      - name: Compile Java
        shell: bash
        run: |
          set -euo pipefail
          GRADLE="$(cat /tmp/gp_gradle_path)"
          PROJ="$(dirname "$(dirname "$GRADLE")")"
          cd "$PROJ"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug --no-daemon -x lint
          elif command -v gradle >/dev/null 2>&1; then
            gradle :app:assembleDebug --no-daemon -x lint
          else
            echo "Gradle not installed; static validation only."
          fi

      - name: Package complete source
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/releases/GreenPlay_Android_Nativo_5_28_52807_SEM_WORKER_CAPAS_DIRETAS.zip"
          rm -f "$OUT"
          cd /tmp/gp52807
          zip -qr "$OUT" .
          unzip -tq "$OUT"
          ls -lh "$OUT"

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GreenPlay Builder"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase
          git add releases/GreenPlay_Android_Nativo_5_28_52807_SEM_WORKER_CAPAS_DIRETAS.zip
          git commit -m "GreenPlay 5.28.7 without TMDB worker dependency" || exit 0
          git push
