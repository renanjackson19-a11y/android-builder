name: Validate GreenPlay 5.28.32

on:
  push:
    paths:
      - '.github/workflows/validate-greenplay-52832.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
      - name: Prepare 5.28.32
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work
          mkdir -p work
          curl -fL --retry 4 --retry-delay 2 \
            https://raw.githubusercontent.com/renanjackson19-a11y/android-builder/b812bbbca647dc84dd47378f09cb4905a9b237b3/uploads/project-20260921-215454-dc8157.zip \
            -o /tmp/base52831.zip
          unzip -q /tmp/base52831.zip -d work

          curl -fL --retry 4 --retry-delay 2 \
            https://raw.githubusercontent.com/renanjackson19-a11y/android-builder/main/validation/52832/player_return_ui.diff.gz.b64 \
            -o /tmp/52832.b64
          tr -d '\r\n' < /tmp/52832.b64 | base64 -d | gzip -d > /tmp/52832.diff
          sed -i \
            -e 's#--- /mnt/data/gpbase52831/app/#--- a/app/#g' \
            -e 's#+++ /mnt/data/gp52832/app/#+++ b/app/#g' \
            /tmp/52832.diff
          (cd work && patch -p1 --forward --batch < /tmp/52832.diff)

          python3 - <<'PY'
          from pathlib import Path
          b=Path('work/app/build.gradle')
          t=b.read_text().replace('versionCode 52831','versionCode 52832').replace("versionName '5.28.31'","versionName '5.28.32'")
          b.write_text(t)
          p=Path('work/app/src/main/java/fun/greenplay/app/PlayerActivity.java')
          s=p.read_text()
          assert 'shortsLandscapeCanvas' in s
          assert '2.88f' in s
          assert 'onVideoSizeChanged(VideoSize v)' in s
          m=Path('work/app/src/main/java/fun/greenplay/app/MainActivity.java').read_text()
          assert 'rememberPlayerReturnState()' in m
          assert 'restorePlayerReturnState()' in m
          print('5.28.32 prepared')
          PY
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Compile debug
        shell: bash
        run: |
          set -euo pipefail
          cd work
          gradle assembleDebug --stacktrace --no-daemon
