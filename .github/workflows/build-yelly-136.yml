name: Build Yelly Doramas 1.0.36
on:
  push:
    paths:
      - '.github/workflows/build-yelly-136.yml'
      - 'inspection/patch_yelly_136_only_floral_background.py'
      - 'inspection/yelly_story_bg_136.b64'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Download untouched 1.0.34 base
        uses: actions/download-artifact@v4
        with:
          name: Yelly-Doramas-1.0.34
          path: base_artifact
          github-token: ${{ github.token }}
          run-id: 36148765455
      - name: Apply only floral background
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work out && mkdir -p work out
          unzip -q base_artifact/Yelly_Doramas_Android_Nativo_1_0_34.zip -d work
          mkdir -p work/app/src/main/res/drawable
          base64 -d inspection/yelly_story_bg_136.b64 > work/app/src/main/res/drawable/yelly_story_bg.jpg
          python3 inspection/patch_yelly_136_only_floral_background.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Compile
        run: cd work && gradle assembleDebug --stacktrace --no-daemon
      - name: Package
        shell: bash
        run: |
          cp work/app/build/outputs/apk/debug/app-debug.apk out/Yelly_Doramas_1.0.36.apk
          (cd work && zip -qr ../out/Yelly_Doramas_Android_Nativo_1_0_36.zip . -x '.gradle/*' 'app/build/*' 'build/*')
      - uses: actions/upload-artifact@v4
        with:
          name: Yelly-Doramas-1.0.36
          path: out/*
          retention-days: 30
