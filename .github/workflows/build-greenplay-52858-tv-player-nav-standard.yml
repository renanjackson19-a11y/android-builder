name: Build GreenPlay 5.28.58 TV Player Nav Standard

on:
  push:
    paths:
      - '.github/workflows/build-greenplay-52858-tv-player-nav-standard.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
      - name: Download 5.28.57 source
        uses: actions/download-artifact@v4
        with:
          name: GreenPlay-5.28.57-greenshorts-tv-player
          path: base_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35796848378
      - name: Patch source
        shell: bash
        run: |
          set -euo pipefail
          mkdir work
          unzip -q base_artifact/GreenPlay_Android_Nativo_5_28_52857_GREENSHORTS_TV_PLAYER.zip -d work
          python3 inspection/patch52858_tv_player_nav_standard.py
          grep -q 'versionCode 52858' work/app/build.gradle
          grep -q 'transform:scale(1.48)' work/app/src/main/java/fun/greenplay/app/YouTubePlayerActivity.java
          grep -q 'new LinearLayout.LayoutParams(dp(104),dp(60))' work/app/src/main/java/fun/greenplay/app/MainActivity.java
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Compile APK
        run: cd work && gradle assembleDebug --stacktrace --no-daemon
      - name: Package output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp work/app/build/outputs/apk/debug/app-debug.apk out/GreenPlay_5.28.58-debug.apk
          (cd work && zip -qr ../out/GreenPlay_Android_Nativo_5_28_52858_TV_PLAYER_NAV_STANDARD.zip . -x '.gradle/*' 'app/build/*' 'build/*')
          unzip -t out/GreenPlay_Android_Nativo_5_28_52858_TV_PLAYER_NAV_STANDARD.zip >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: GreenPlay-5.28.58-tv-player-nav-standard
          path: out/*
          if-no-files-found: error
          retention-days: 30
