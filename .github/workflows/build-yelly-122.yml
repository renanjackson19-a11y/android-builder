name: Build Yelly Doramas 1.0.22

on:
  push:
    paths:
      - '.github/workflows/build-yelly-122.yml'
      - 'inspection/patch_yelly_122_sources_and_youtube.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Download Yelly 1.0.21 source
        uses: actions/download-artifact@v4
        with:
          name: Yelly-Doramas-1.0.21
          path: base_artifact
          github-token: ${{ github.token }}
          run-id: 36109703587

      - name: Download Yelly 1.0.17 source for working YouTube classes
        uses: actions/download-artifact@v4
        with:
          name: Yelly-Doramas-1.0.17
          path: yt_artifact
          github-token: ${{ github.token }}
          run-id: 36103234733

      - name: Apply Yelly 1.0.22
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work oldyt out
          mkdir -p work oldyt out
          unzip -q base_artifact/Yelly_Doramas_Android_Nativo_1_0_21.zip -d work
          unzip -q yt_artifact/Yelly_Doramas_Android_Nativo_1_0_17.zip -d oldyt
          cp oldyt/app/src/main/java/fun/greenplay/app/StoriesActivity.java work/app/src/main/java/fun/greenplay/app/StoriesActivity.java
          cp oldyt/app/src/main/java/fun/greenplay/app/YouTubePlayerActivity.java work/app/src/main/java/fun/greenplay/app/YouTubePlayerActivity.java
          python3 inspection/patch_yelly_122_sources_and_youtube.py

          grep -q "versionName '1.0.22'" work/app/build.gradle
          grep -q 'YouTubePlayerActivity' work/app/src/main/AndroidManifest.xml
          grep -q 'Fonte:  "+doramaSourceName' work/app/src/main/java/fun/greenplay/app/MainActivity.java
          grep -q 'renderExternalSourceRow("DramaHub"' work/app/src/main/java/fun/greenplay/app/MainActivity.java
          grep -q 'renderExternalSourceRow("DramaTall"' work/app/src/main/java/fun/greenplay/app/MainActivity.java
          grep -q 'new Intent(this,YouTubePlayerActivity.class)' work/app/src/main/java/fun/greenplay/app/MainActivity.java
          grep -q 'YouTube  •' work/app/src/main/java/fun/greenplay/app/StoriesActivity.java

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Compile Yelly
        run: cd work && gradle assembleDebug --stacktrace --no-daemon

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          cp work/app/build/outputs/apk/debug/app-debug.apk out/Yelly_Doramas_1.0.22.apk
          (cd work && zip -qr ../out/Yelly_Doramas_Android_Nativo_1_0_22.zip . -x '.gradle/*' 'app/build/*' 'build/*')
          unzip -t out/Yelly_Doramas_Android_Nativo_1_0_22.zip >/dev/null
          sha256sum out/*

      - uses: actions/upload-artifact@v4
        with:
          name: Yelly-Doramas-1.0.22
          path: out/*
          if-no-files-found: error
          retention-days: 30
