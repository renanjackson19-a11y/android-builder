name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      project_zip:
        description: Caminho exato do ZIP enviado pelo painel
        required: true
        type: string
      build_type:
        description: debug ou release
        required: true
        default: release
        type: string
      commit_sha:
        description: Commit que contém o ZIP (opcional para painéis antigos)
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha != '' && inputs.commit_sha || github.ref_name }}
          fetch-depth: 1

      - name: Garantir ZIP enviado
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_ZIP="${{ inputs.project_zip }}"
          COMMIT_SHA="${{ inputs.commit_sha }}"
          if [ -n "$COMMIT_SHA" ] && [ -f "$PROJECT_ZIP" ]; then
            echo "ZIP confirmado no commit exato: $COMMIT_SHA"
            exit 0
          fi
          for tentativa in $(seq 1 15); do
            if [ -f "$PROJECT_ZIP" ]; then
              echo "ZIP confirmado: $PROJECT_ZIP"
              exit 0
            fi
            echo "Aguardando o ZIP aparecer na branch (tentativa $tentativa/15)..."
            git fetch origin "${{ github.ref_name }}" --depth=1
            git reset --hard "origin/${{ github.ref_name }}"
            sleep 2
          done
          echo "ERRO: o arquivo informado não foi encontrado: $PROJECT_ZIP"
          find uploads -maxdepth 3 -type f -print || true
          exit 1

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Preparar projeto
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work output
          mkdir -p work output
          PROJECT_ZIP="${{ inputs.project_zip }}"
          unzip -q "$PROJECT_ZIP" -d work
          WRAPPER=$(find work -type f -name gradlew | head -n 1 || true)
          if [ -n "$WRAPPER" ]; then
            ROOT="$(dirname "$WRAPPER")"
            BUILD_MODE="wrapper"
            chmod +x "$WRAPPER"
          else
            SETTINGS=$(find work -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1 || true)
            if [ -z "$SETTINGS" ]; then
              echo "ERRO: projeto Gradle não encontrado."
              exit 1
            fi
            ROOT="$(dirname "$SETTINGS")"
            BUILD_MODE="system"
          fi
          if [ ! -f "$ROOT/build.gradle" ] && [ ! -f "$ROOT/build.gradle.kts" ]; then
            echo "ERRO: build.gradle não encontrado em $ROOT"
            exit 1
          fi
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "BUILD_MODE=$BUILD_MODE" >> "$GITHUB_ENV"
          echo "Raiz detectada: $ROOT"

      - name: Configurar Gradle sem wrapper
        if: ${{ env.BUILD_MODE == 'system' }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK debug ARM64
        if: ${{ inputs.build_type == 'debug' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          if [ "$BUILD_MODE" = "wrapper" ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Compilar APK release otimizado ARM64
        if: ${{ inputs.build_type == 'release' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          echo "[GreenPlay] Gerando APK RELEASE ARM64 otimizado."
          if [ "$BUILD_MODE" = "wrapper" ]; then
            ./gradlew assembleRelease --stacktrace --no-daemon
          else
            gradle assembleRelease --stacktrace --no-daemon
          fi

      - name: Reunir APKs
        shell: bash
        run: |
          set -euo pipefail
          find "$PROJECT_ROOT" -type f -path "*/build/outputs/apk/*" -name "*.apk" -exec cp {} output/ \;
          echo "APKs encontrados:"
          ls -lah output || true
          APK_COUNT=$(find output -maxdepth 1 -type f -name "*.apk" | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERRO: nenhum APK encontrado."
            exit 1
          fi

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.run_number }}
          path: output/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
