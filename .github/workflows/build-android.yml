name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      project_zip:
        description: Caminho exato do ZIP enviado pelo painel
        required: true
        type: string
      build_type:
        description: debug ou release
        required: true
        default: debug
        type: string
      commit_sha:
        description: Commit exato que contém o ZIP
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar commit exato do projeto
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Preparar projeto
        run: |
          set -euo pipefail
          mkdir -p work

          PROJECT_ZIP="${{ inputs.project_zip }}"

          if [ ! -f "$PROJECT_ZIP" ]; then
            echo "ERRO: o arquivo confirmado pelo painel não está no commit ${{ inputs.commit_sha }}: $PROJECT_ZIP"
            echo "Arquivos disponíveis em uploads:"
            find uploads -maxdepth 2 -type f -print || true
            exit 1
          fi

          unzip -q "$PROJECT_ZIP" -d work
          ROOT=$(find work -type f -name gradlew -printf '%h\n' | head -n 1)

          if [ -z "$ROOT" ]; then
            echo "ERRO: gradlew não encontrado no ZIP."
            find work -maxdepth 4 -type f -print
            exit 1
          fi

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          chmod +x "$ROOT/gradlew"

      - name: Compilar APK debug
        if: ${{ inputs.build_type == 'debug' }}
        run: |
          cd "$PROJECT_ROOT"
          ./gradlew assembleDebug --stacktrace

      - name: Compilar APK release
        if: ${{ inputs.build_type == 'release' }}
        run: |
          cd "$PROJECT_ROOT"
          ./gradlew assembleRelease --stacktrace

      - name: Reunir APKs
        run: |
          mkdir -p output
          find "$PROJECT_ROOT" -type f -name "*.apk" -exec cp {} output/ \;
          ls -lah output
          test "$(find output -type f -name '*.apk' | wc -l)" -gt 0

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.run_number }}
          path: output/*.apk
          if-no-files-found: error
          retention-days: 30
