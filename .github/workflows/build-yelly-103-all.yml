name: Build Yelly Doramas 1.0.3

on:
  push:
    paths:
      - '.github/workflows/build-yelly-103-all.yml'
      - 'inspection/patch103_*.b64'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Download Yelly 1.0.2 source
        uses: actions/download-artifact@v4
        with:
          name: Yelly-Doramas-1.0.2
          path: base_artifact
          github-token: ${{ github.token }}
          run-id: 36073087407

      - name: Apply all Yelly 1.0.3 changes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work out
          mkdir -p work out
          unzip -q base_artifact/Yelly_Doramas_Android_Nativo_1_0_2.zip -d work
          cat inspection/patch103_00.b64 inspection/patch103_01.b64 inspection/patch103_02.b64 | base64 -d | gzip -d > /tmp/patch_yelly_103_all.py
          python3 /tmp/patch_yelly_103_all.py
          grep -q "versionName '1.0.3'" work/app/build.gradle
          grep -q 'navItem("","Stories",2)' work/app/src/main/java/fun/greenplay/app/MainActivity.java
          grep -q 'dorama_enrich' work/app/src/main/java/fun/greenplay/app/MainActivity.java
          grep -q 'class StoriesActivity' work/app/src/main/java/fun/greenplay/app/StoriesActivity.java
          grep -q 'StoriesActivity' work/app/src/main/AndroidManifest.xml
          test -s work/app/src/main/res/drawable/ic_nav_stories.xml
          if grep -RIn 'Color.rgb(32,224,112)' work/app/src/main/java/fun/greenplay/app/PlayerActivity.java work/app/src/main/java/fun/greenplay/app/YouTubePlayerActivity.java; then
            echo "Old GreenPlay green remains in player"
            exit 1
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Compile Yelly
        run: cd work && gradle assembleDebug --stacktrace --no-daemon

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          cp work/app/build/outputs/apk/debug/app-debug.apk out/Yelly_Doramas_1.0.3.apk
          (cd work && zip -qr ../out/Yelly_Doramas_Android_Nativo_1_0_3.zip . -x '.gradle/*' 'app/build/*' 'build/*')
          unzip -t out/Yelly_Doramas_Android_Nativo_1_0_3.zip >/dev/null
          sha256sum out/*

      - uses: actions/upload-artifact@v4
        with:
          name: Yelly-Doramas-1.0.3
          path: out/*
          if-no-files-found: error
          retention-days: 30
