name: Inspect GreenPlay Home Profile Exact

on:
  push:
    paths:
      - '.github/workflows/inspect-greenplay-home-profile-exact.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          curl -fL https://raw.githubusercontent.com/renanjackson19-a11y/android-builder/b249a4153e2d626422639dcdc7f3d1439ecda257/uploads/project-20260921-234805-ae4fe1.zip -o /tmp/p.zip
          mkdir work && unzip -q /tmp/p.zip -d work
          F=work/app/src/main/java/fun/greenplay/app/MainActivity.java
          echo '===== DEFS ====='
          grep -nE "^ *void (home|profile|clear|setNav|goHomeNow|buildNav|nav)|navHome\.setOnClickListener|navProfile\.setOnClickListener" "$F"
          echo '===== 780-1180 ====='
          sed -n '780,1180p' "$F"
          echo '===== 2520-2760 ====='
          sed -n '2520,2760p' "$F"
