name: Build GreenPlay 5.28.36 Persistent Category Cache

on:
  push:
    paths:
      - '.github/workflows/build-greenplay-52836-category-cache.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
      - name: Prepare 5.28.36
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 \
            https://raw.githubusercontent.com/renanjackson19-a11y/android-builder/283c31cdd617927296397d01a10ed785e85220ab/uploads/project-20260922-020307-c4ac1a.zip \
            -o /tmp/base52835.zip
          rm -rf work && mkdir work
          unzip -q /tmp/base52835.zip -d work

          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('work/app/src/main/java/fun/greenplay/app/MainActivity.java')
          s=p.read_text()

          # 1) callback + cache LRU persistente por usuário/provedor/categoria.
          old='interface PersistentHomeCB{void ok(JSONObject j);void miss();}'
          new='interface PersistentHomeCB{void ok(JSONObject j);void miss();} interface CategoryCacheCB{void hit(JSONArray rows);void miss();}'
          assert old in s
          s=s.replace(old,new,1)

          old='static final java.util.concurrent.ExecutorService CATALOG_IO=java.util.concurrent.Executors.newSingleThreadExecutor();'
          new='''static final java.util.concurrent.ExecutorService CATALOG_IO=java.util.concurrent.Executors.newSingleThreadExecutor();
 static final int FULL_CATEGORY_MEM_MAX=4;
 static final long FULL_CATEGORY_DISK_TTL_MS=72L*60L*60L*1000L;
 static final java.util.LinkedHashMap<String,JSONArray> FULL_CATEGORY_MEM=new java.util.LinkedHashMap<String,JSONArray>(8,0.75f,true){
  protected boolean removeEldestEntry(java.util.Map.Entry<String,JSONArray> e){return size()>FULL_CATEGORY_MEM_MAX;}
 };'''
          assert old in s
          s=s.replace(old,new,1)

          # 2) Métodos de cache separado. Não infla o snapshot da Home.
          anchor='void persistHomeCacheAsync(JSONObject j){'
          assert anchor in s
          methods=r'''
 String fullCategoryCacheKey(int typeId,String categoryId){
  String raw="category52836_"+uid+"_"+(Api.PROVIDER==null?"":Api.PROVIDER)+"_"+typeId+"_"+(categoryId==null?"":categoryId);
  return raw.replaceAll("[^A-Za-z0-9._-]","_");
 }
 java.io.File fullCategoryCacheFile(int typeId,String categoryId){
  java.io.File dir=new java.io.File(getFilesDir(),"gp_category_cache");if(!dir.exists())dir.mkdirs();
  return new java.io.File(dir,fullCategoryCacheKey(typeId,categoryId)+".json.gz");
 }
 JSONArray fullCategoryMemGet(int typeId,String categoryId){
  synchronized(FULL_CATEGORY_MEM){return FULL_CATEGORY_MEM.get(fullCategoryCacheKey(typeId,categoryId));}
 }
 void fullCategoryMemPut(int typeId,String categoryId,JSONArray rows){
  if(rows==null||rows.length()==0)return;synchronized(FULL_CATEGORY_MEM){FULL_CATEGORY_MEM.put(fullCategoryCacheKey(typeId,categoryId),rows);}
 }
 void persistFullCategoryAsync(int typeId,String categoryId,JSONArray rows){
  if(rows==null||rows.length()==0)return;fullCategoryMemPut(typeId,categoryId,rows);
  final String key=fullCategoryCacheKey(typeId,categoryId);final java.io.File target=fullCategoryCacheFile(typeId,categoryId);
  CATALOG_IO.execute(()->{java.io.File tmp=new java.io.File(target.getParentFile(),target.getName()+".tmp");try{
   java.io.OutputStream fos=new java.io.FileOutputStream(tmp);
   java.util.zip.GZIPOutputStream gz=new java.util.zip.GZIPOutputStream(fos,32768);
   java.io.Writer w=new java.io.BufferedWriter(new java.io.OutputStreamWriter(gz,java.nio.charset.StandardCharsets.UTF_8),32768);
   writeJsonStream(w,rows);w.flush();w.close();
   if(target.exists())target.delete();
   if(!tmp.renameTo(target)){java.io.InputStream in=new java.io.FileInputStream(tmp);java.io.OutputStream out=new java.io.FileOutputStream(target);byte[] b=new byte[32768];int n;while((n=in.read(b))>0)out.write(b,0,n);in.close();out.close();tmp.delete();}
  }catch(Throwable e){try{tmp.delete();}catch(Exception ignored){}}});
 }
 void loadFullCategoryAsync(int typeId,String categoryId,CategoryCacheCB cb){
  JSONArray mem=fullCategoryMemGet(typeId,categoryId);if(mem!=null&&mem.length()>0){cb.hit(mem);return;}
  final String key=fullCategoryCacheKey(typeId,categoryId);final java.io.File f=fullCategoryCacheFile(typeId,categoryId);
  if(!f.exists()||f.length()<32||System.currentTimeMillis()-f.lastModified()>FULL_CATEGORY_DISK_TTL_MS){cb.miss();return;}
  CATALOG_IO.execute(()->{JSONArray out=null;try{
   java.io.InputStream in=new java.util.zip.GZIPInputStream(new java.io.BufferedInputStream(new java.io.FileInputStream(f),32768),32768);
   java.io.Reader r=new java.io.BufferedReader(new java.io.InputStreamReader(in,java.nio.charset.StandardCharsets.UTF_8),32768);
   final int maxChars=32*1024*1024;StringBuilder b=new StringBuilder((int)Math.min(1024*1024,Math.max(65536,f.length()*4)));char[] c=new char[32768];int n;
   while((n=r.read(c))>0){if(b.length()+n>maxChars)throw new java.io.IOException("cache de categoria muito grande");b.append(c,0,n);}r.close();
   out=new JSONArray(b.toString());if(out.length()==0)out=null;
  }catch(Throwable e){try{f.delete();}catch(Exception ignored){}}
  final JSONArray ready=out;runOnUiThread(()->{if(!key.equals(fullCategoryCacheKey(typeId,categoryId))){cb.miss();return;}if(ready!=null){fullCategoryMemPut(typeId,categoryId,ready);cb.hit(ready);}else cb.miss();});});
 }
 void applyLoadedCategoryRows(JSONArray first,JSONArray full,int gen){
  if(gen!=viewGen||full==null||full.length()==0)return;
  if(first==null||first.length()==0){grid(full);return;}
  if(!wideTvUi()&&mobileCategoryGrid!=null&&mobileCategoryGen==gen){mobileCategoryRows=full;maybeLoadMoreMobileCategory(true);}
  else if(wideTvUi()&&full.length()>first.length()){grid(full);}
 }
'''
          s=s.replace(anchor,methods+'\n '+anchor,1)

          # 3) O método anterior jogava fora os rows completos. Agora salva em memória + disco.
          old_re=r'''void storeFullCategoryInHomeCache\(int typeId,String categoryId,JSONArray rows\)\{
 .*?
 \}'''
          m=re.search(old_re,s,re.S)
          assert m, 'storeFullCategoryInHomeCache not found'
          new_store='''void storeFullCategoryInHomeCache(int typeId,String categoryId,JSONArray rows){
  if(rows!=null&&rows.length()>0)persistFullCategoryAsync(typeId,categoryId,rows);
  try{JSONObject cache=readHomeCache();if(cache==null)return;JSONArray secs=cache.optJSONArray("result");if(secs==null)return;for(int i=0;i<secs.length();i++){JSONObject sec=secs.optJSONObject(i);if(sec==null)continue;int t=sec.optInt("type_id",sec.optInt("video_type",1));String cid=sec.optString("category_id","");if(t==typeId&&categoryId.equals(cid)){sec.put("category_total",rows==null?0:rows.length());sec.remove("category_complete");saveHomeCache(cache);return;}}}catch(Exception ignored){}
 }'''
          s=s[:m.start()]+new_store+s[m.end():]

          # 4) Ao reabrir, usa cache carregado primeiro; rede só na primeira vez/expiração.
          old_open=r'''void openSection\(JSONObject sec\)\{
   final String returnTab=activeHomeTab;beginSectionPage\(returnTab\);
   int typeId=sec\.optInt\("type_id",sec\.optInt\("video_type",1\)\);clear\(\);setNav\(0\);final int gen=viewGen;String title=cleanCategoryDisplayTitle\(sec\.optString\("title","Conteúdos"\),typeId\);pageTitle\(title,\(\)->closeSectionPage\(\)\);
   final String cid=sec\.optString\("category_id",""\)\.trim\(\);final boolean categoryComplete=sec\.optInt\("category_complete",0\)==1;final JSONArray first=sec\.optJSONArray\("data"\);
   if\(first!=null&&first\.length\(\)>0\)grid\(first\);
   if\(cid\.isEmpty\(\)\|\|categoryComplete\)return;
   fetchAllCategoryPages\(typeId,cid,new AllPagesCB\(\)\{public void ok\(JSONArray full\)\{if\(gen!=viewGen\|\|full==null\|\|full\.length\(\)==0\)return;JSONArray merged=mergeCategoryRows\(first,full\);try\{sec\.put\("category_total",merged\.length\(\)\);sec\.remove\("category_complete"\);\}catch\(Exception ignored\)\{\}storeFullCategoryInHomeCache\(typeId,cid,merged\);if\(first==null\|\|first\.length\(\)==0\)\{grid\(merged\);return;\}if\(!wideTvUi\(\)&&mobileCategoryGrid!=null&&mobileCategoryGen==gen\)\{mobileCategoryRows=merged;maybeLoadMoreMobileCategory\(true\);\}else if\(wideTvUi\(\)&&merged\.length\(\)>first\.length\(\)\)\{grid\(merged\);\}\}public void err\(String e\)\{/\* Mantem o que ja estava visivel; nunca troca por tela de loading/erro\. \*/\}\}\);
  \}'''
          m=re.search(old_open,s,re.S)
          assert m, 'openSection exact block not found'
          new_open='''void openSection(JSONObject sec){
   final String returnTab=activeHomeTab;beginSectionPage(returnTab);
   int typeId=sec.optInt("type_id",sec.optInt("video_type",1));clear();setNav(0);final int gen=viewGen;String title=cleanCategoryDisplayTitle(sec.optString("title","Conteúdos"),typeId);pageTitle(title,()->closeSectionPage());
   final String cid=sec.optString("category_id","").trim();final JSONArray first=sec.optJSONArray("data");
   if(cid.isEmpty()){if(first!=null&&first.length()>0)grid(first);return;}
   JSONArray mem=fullCategoryMemGet(typeId,cid);if(mem!=null&&mem.length()>0){grid(mem);return;}
   if(first!=null&&first.length()>0)grid(first);
   loadFullCategoryAsync(typeId,cid,new CategoryCacheCB(){
    public void hit(JSONArray cached){if(gen!=viewGen)return;applyLoadedCategoryRows(first,cached,gen);}
    public void miss(){if(gen!=viewGen)return;fetchAllCategoryPages(typeId,cid,new AllPagesCB(){
     public void ok(JSONArray full){if(gen!=viewGen||full==null||full.length()==0)return;JSONArray merged=mergeCategoryRows(first,full);try{sec.put("category_total",merged.length());sec.remove("category_complete");}catch(Exception ignored){}storeFullCategoryInHomeCache(typeId,cid,merged);applyLoadedCategoryRows(first,merged,gen);}
     public void err(String e){/* Mantém a primeira amostra visível; tenta novamente apenas na próxima entrada. */}
    });}
   });
  }'''
          s=s[:m.start()]+new_open+s[m.end():]

          # 5) versão.
          p.write_text(s)
          bg=Path('work/app/build.gradle')
          t=bg.read_text().replace('versionCode 52835','versionCode 52836').replace("versionName '5.28.35'","versionName '5.28.36'")
          bg.write_text(t)

          # validações textuais
          z=p.read_text()
          assert 'FULL_CATEGORY_MEM_MAX=4' in z
          assert 'persistFullCategoryAsync(typeId,categoryId,rows)' in z
          assert 'loadFullCategoryAsync(typeId,cid' in z
          assert 'versionCode 52836' in bg.read_text()
          print('GreenPlay 5.28.36 prepared')
          PY

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Compile debug
        shell: bash
        run: |
          set -euo pipefail
          cd work
          gradle assembleDebug --stacktrace --no-daemon

      - name: Pack full source
        shell: bash
        run: |
          set -euo pipefail
          cd work
          zip -qr ../GreenPlay_Android_Nativo_5_28_52836_CACHE_CATEGORIA_PERSISTENTE.zip .
          cd ..
          unzip -t GreenPlay_Android_Nativo_5_28_52836_CACHE_CATEGORIA_PERSISTENTE.zip >/dev/null
          cp work/app/build/outputs/apk/debug/app-debug.apk GreenPlay_5.28.36_debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GreenPlay-5.28.36-cache-categoria
          path: |
            GreenPlay_Android_Nativo_5_28_52836_CACHE_CATEGORIA_PERSISTENTE.zip
            GreenPlay_5.28.36_debug.apk
          if-no-files-found: error
