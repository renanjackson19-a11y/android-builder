name: Build CineTV Super 1.0.0

on:
  push:
    paths:
      - '.github/workflows/build-cinetv-super-100.yml'
      - 'inspection/patch_cinetv_super_100.py'

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Download stable GreenPlay engine
        uses: actions/download-artifact@v4
        with:
          name: GreenPlay-5.28.99-tv-keyboard-stable
          path: base_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36270692686

      - name: Create CineTV Super source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work out
          mkdir -p work out
          unzip -q base_artifact/GreenPlay_Android_Nativo_5_28_52899_TV_KEYBOARD_STABLE.zip -d work
          python3 inspection/patch_cinetv_super_100.py

          mkdir -p work/app/src/main/res/drawable-nodpi
          curl -fsSL --retry 4 -o work/app/src/main/res/drawable-nodpi/cinetv_app_icon.png https://cinetv.clickaqui.site/assets/images/app/cinetv_super_app_icon.png
          curl -fsSL --retry 4 -o work/app/src/main/res/drawable-nodpi/cinetv_tv_banner.png https://cinetv.clickaqui.site/assets/images/app/cinetv_super_tv_banner.png
          curl -fsSL --retry 4 -o work/app/src/main/res/drawable-nodpi/cinetv_logo_fallback.jpg https://cinetv.clickaqui.site/assets/images/app/cinetv_super_logo.jpg
          curl -fsSL --retry 4 -o work/app/src/main/res/drawable-nodpi/cinetv_login_bg.jpg https://cinetv.clickaqui.site/assets/images/app/cinetv_super_bg_portrait.jpg

          grep -q "applicationId 'site.clickaqui.cinetv'" work/app/build.gradle
          grep -q "versionName '1.0.0'" work/app/build.gradle
          grep -q "CineTV Super" work/app/src/main/AndroidManifest.xml
          ! grep -R -n -E 'GreenPlay|Green Play|greenplay\.fun' work/app/src/main/java work/app/src/main/res work/app/RELEASE_NOTES.txt

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Compile CineTV Super APK
        run: cd work && gradle assembleDebug --stacktrace --no-daemon

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          cp work/app/build/outputs/apk/debug/app-debug.apk out/CineTV_Super_1.0.0.apk
          (cd work && zip -qr ../out/CineTV_Super_Android_Nativo_1_0_0_FONTE.zip . -x '.gradle/*' 'app/build/*' 'build/*')
          unzip -t out/CineTV_Super_Android_Nativo_1_0_0_FONTE.zip >/dev/null
          sha256sum out/*

      - name: Publish build files in repository
        shell: bash
        run: |
          set -euo pipefail
          cp out/CineTV_Super_1.0.0.apk releases/
          cp out/CineTV_Super_Android_Nativo_1_0_0_FONTE.zip releases/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/CineTV_Super_1.0.0.apk releases/CineTV_Super_Android_Nativo_1_0_0_FONTE.zip
          git commit -m "Publish CineTV Super 1.0.0" || true
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: CineTV-Super-1.0.0
          path: out/*
          if-no-files-found: error
          retention-days: 30
