name: Build GreenPlay 5.28.77 VOD Only Bootstrap
on:
  push:
    paths:
      - '.github/workflows/build-greenplay-52877-vod-only-bootstrap.yml'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
      - name: Download 5.28.76 source
        uses: actions/download-artifact@v4
        with:
          name: GreenPlay-5.28.76-centered-vpn-modal
          path: base_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35877615598
      - name: Apply VOD-only fix
        run: |
          rm -rf work out
          mkdir -p work out
          unzip -q base_artifact/GreenPlay_Android_Nativo_5_28_52876_VPN_CENTER.zip -d work
          python3 inspection/patch52877_vod_only_bootstrap.py
          grep -q 'versionCode 52877' work/app/build.gradle
          grep -q 'FILMES  •  SÉRIES  •  CAPAS' work/app/src/main/java/fun/greenplay/app/MainActivity.java
          grep -q 'vodOnlyKnown' work/app/src/main/java/fun/greenplay/app/MainActivity.java
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Compile APK
        run: cd work && gradle assembleDebug --stacktrace --no-daemon
      - name: Package
        run: |
          cp work/app/build/outputs/apk/debug/app-debug.apk out/GreenPlay_5.28.77-VOD-ONLY.apk
          (cd work && zip -qr ../out/GreenPlay_Android_Nativo_5_28_52877_VOD_ONLY.zip . -x '.gradle/*' 'app/build/*' 'build/*')
          sha256sum out/*
      - uses: actions/upload-artifact@v4
        with:
          name: GreenPlay-5.28.77-vod-only-bootstrap
          path: out/*
          if-no-files-found: error
          retention-days: 30
