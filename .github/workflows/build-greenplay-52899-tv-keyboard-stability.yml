name: Build GreenPlay 5.28.99 TV Keyboard Stability

on:
  push:
    paths:
      - '.github/workflows/build-greenplay-52899-tv-keyboard-stability.yml'
      - 'inspection/patch52899_tv_keyboard_stability.py'

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Download GreenPlay 5.28.98 source
        uses: actions/download-artifact@v4
        with:
          name: GreenPlay-5.28.98-tv-login-responsive
          path: base_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36269631448

      - name: Apply TV keyboard stability fix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work out
          mkdir -p work out
          unzip -q base_artifact/GreenPlay_Android_Nativo_5_28_52898_TV_LOGIN_RESPONSIVE.zip -d work
          python3 inspection/patch52899_tv_keyboard_stability.py
          grep -q 'versionCode 52899' work/app/build.gradle
          grep -q "versionName '5.28.99'" work/app/build.gradle
          grep -q 'controle pertence ao IME' work/app/src/main/java/fun/greenplay/app/MainActivity.java
          ! grep -q 'SHOW_FORCED' work/app/src/main/java/fun/greenplay/app/MainActivity.java

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Compile APK
        run: cd work && gradle assembleDebug --stacktrace --no-daemon

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          cp work/app/build/outputs/apk/debug/app-debug.apk out/GreenPlay_5.28.99-TV-KEYBOARD-STABLE.apk
          (cd work && zip -qr ../out/GreenPlay_Android_Nativo_5_28_52899_TV_KEYBOARD_STABLE.zip . -x '.gradle/*' 'app/build/*' 'build/*')
          unzip -t out/GreenPlay_Android_Nativo_5_28_52899_TV_KEYBOARD_STABLE.zip >/dev/null
          sha256sum out/*

      - name: Publish build files in repository
        shell: bash
        run: |
          set -euo pipefail
          cp out/GreenPlay_5.28.99-TV-KEYBOARD-STABLE.apk releases/
          cp out/GreenPlay_Android_Nativo_5_28_52899_TV_KEYBOARD_STABLE.zip releases/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/GreenPlay_5.28.99-TV-KEYBOARD-STABLE.apk releases/GreenPlay_Android_Nativo_5_28_52899_TV_KEYBOARD_STABLE.zip
          git commit -m "Publish GreenPlay 5.28.99 TV keyboard stability" || true
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: GreenPlay-5.28.99-tv-keyboard-stable
          path: out/*
          if-no-files-found: error
          retention-days: 30
