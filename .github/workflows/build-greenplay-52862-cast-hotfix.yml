name: Build GreenPlay 5.28.62 Cast Startup Hotfix

on:
  push:
    paths:
      - '.github/workflows/build-greenplay-52862-cast-hotfix.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
      - name: Download 5.28.61 source
        uses: actions/download-artifact@v4
        with:
          name: GreenPlay-5.28.61-scroll-cast
          path: base_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35802736714
      - name: Patch source
        shell: bash
        run: |
          set -euo pipefail
          mkdir work
          unzip -q base_artifact/GreenPlay_Android_Nativo_5_28_52861_SCROLL_CAST.zip -d work
          python3 inspection/patch52862_cast_startup_hotfix.py
          grep -q 'versionCode 52862' work/app/build.gradle
          grep -q 'ImageView headerCastButton' work/app/src/main/java/fun/greenplay/app/MainActivity.java
          grep -q 'getMergedSelector' work/app/src/main/java/fun/greenplay/app/CastHelper.java
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Compile APK
        run: cd work && gradle assembleDebug --stacktrace --no-daemon
      - name: Package output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp work/app/build/outputs/apk/debug/app-debug.apk out/GreenPlay_5.28.62-debug.apk
          (cd work && zip -qr ../out/GreenPlay_Android_Nativo_5_28_52862_CAST_HOTFIX.zip . -x '.gradle/*' 'app/build/*' 'build/*')
          unzip -t out/GreenPlay_Android_Nativo_5_28_52862_CAST_HOTFIX.zip >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: GreenPlay-5.28.62-cast-hotfix
          path: out/*
          if-no-files-found: error
          retention-days: 30
