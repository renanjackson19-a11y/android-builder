name: Build GreenPlay 5.28.96 Football Instant Open

on:
  push:
    paths:
      - '.github/workflows/build-greenplay-52896-football-instant-open.yml'
      - 'inspection/patch52896_football_instant_open.py'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Download GreenPlay 5.28.95 source
        uses: actions/download-artifact@v4
        with:
          name: GreenPlay-5.28.95-football-reminders
          path: base_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36029045048

      - name: Apply instant football opening
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work out
          mkdir -p work out
          unzip -q base_artifact/GreenPlay_Android_Nativo_5_28_52895_FOOTBALL_REMINDERS.zip -d work
          python3 inspection/patch52896_football_instant_open.py
          grep -q 'versionCode 52896' work/app/build.gradle
          grep -q "versionName '5.28.96'" work/app/build.gradle
          grep -q '24L\*60L\*60L\*1000L' work/app/src/main/java/fun/greenplay/app/MainActivity.java
          grep -q 'prefetchFootballToday();' work/app/src/main/java/fun/greenplay/app/MainActivity.java
          grep -q 'footballPrefetchBusy&&date.equals(today)' work/app/src/main/java/fun/greenplay/app/MainActivity.java

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Compile APK
        run: cd work && gradle assembleDebug --stacktrace --no-daemon

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          cp work/app/build/outputs/apk/debug/app-debug.apk out/GreenPlay_5.28.96-FOOTBALL-INSTANT-OPEN.apk
          (cd work && zip -qr ../out/GreenPlay_Android_Nativo_5_28_52896_FOOTBALL_INSTANT_OPEN.zip . -x '.gradle/*' 'app/build/*' 'build/*')
          unzip -t out/GreenPlay_Android_Nativo_5_28_52896_FOOTBALL_INSTANT_OPEN.zip >/dev/null
          sha256sum out/*

      - uses: actions/upload-artifact@v4
        with:
          name: GreenPlay-5.28.96-football-instant-open
          path: out/*
          if-no-files-found: error
          retention-days: 30
