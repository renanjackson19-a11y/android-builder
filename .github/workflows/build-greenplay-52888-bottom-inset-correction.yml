name: Build GreenPlay 5.28.88 Bottom Inset Correction

on:
  push:
    paths:
      - '.github/workflows/build-greenplay-52888-bottom-inset-correction.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Download GreenPlay 5.28.87 source
        uses: actions/download-artifact@v4
        with:
          name: GreenPlay-5.28.87-adaptive-bottom
          path: base_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35935422350

      - name: Apply corrected bottom insets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work out apkcheck
          mkdir -p work out
          unzip -q base_artifact/GreenPlay_Android_Nativo_5_28_52887_ADAPTIVE_BOTTOM.zip -d work
          python3 inspection/patch52888_bottom_inset_correction.py
          grep -q 'versionCode 52888' work/app/build.gradle
          grep -q "versionName '5.28.88'" work/app/build.gradle
          grep -q 'WindowInsets.Type.navigationBars' work/app/src/main/java/fun/greenplay/app/MainActivity.java
          ! grep -q 'WindowInsets.Type.systemGestures' work/app/src/main/java/fun/greenplay/app/MainActivity.java
          grep -q 'int baseH=dp(58)' work/app/src/main/java/fun/greenplay/app/MainActivity.java

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Compile APK
        run: cd work && gradle assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=work/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          mkdir -p apkcheck
          unzip -q "$APK" 'classes*.dex' -d apkcheck
          STRINGS=/tmp/allstrings.txt
          find apkcheck -name 'classes*.dex' -print0 | xargs -0 strings -a > "$STRINGS"
          if grep -Fq '454946ee403e82a9657eafc76091ccb6d8ccd4a8fadfca45' "$STRINGS"; then
            echo 'Plain API token leaked into DEX' >&2
            exit 1
          fi
          if grep -Eqi 'greenplay-media-proxy|/media/p/|:8770' "$STRINGS"; then
            echo 'Relay reference found in APK' >&2
            exit 1
          fi
          if command -v apkanalyzer >/dev/null 2>&1; then
            apkanalyzer manifest debuggable "$APK" | tee /tmp/debuggable.txt
            ! grep -qi '^true$' /tmp/debuggable.txt
          fi

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          cp work/app/build/outputs/apk/debug/app-debug.apk out/GreenPlay_5.28.88-BOTTOM-FIX.apk
          (cd work && zip -qr ../out/GreenPlay_Android_Nativo_5_28_52888_BOTTOM_FIX.zip . -x '.gradle/*' 'app/build/*' 'build/*')
          unzip -t out/GreenPlay_Android_Nativo_5_28_52888_BOTTOM_FIX.zip >/dev/null
          sha256sum out/*

      - uses: actions/upload-artifact@v4
        with:
          name: GreenPlay-5.28.88-bottom-fix
          path: out/*
          if-no-files-found: error
          retention-days: 30
