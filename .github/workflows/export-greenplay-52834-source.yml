name: Export GreenPlay 5.28.34 Source

on:
  push:
    paths:
      - '.github/workflows/export-greenplay-52834-source.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 \
            https://raw.githubusercontent.com/renanjackson19-a11y/android-builder/1c647610b6d6863016e9501d5ccc4d1bf482dce0/uploads/project-20260922-001053-d98d13.zip \
            -o GreenPlay_5_28_34_Source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: greenplay-52834-source
          path: GreenPlay_5_28_34_Source.zip
