name: Build Yelly Doramas 1.0.20

on:
  push:
    paths:
      - '.github/workflows/build-yelly-120.yml'
      - 'inspection/patch_yelly_120_native_demo.py'
      - 'inspection/yelly_demo.mp4'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Download native Yelly 1.0.16 source
        uses: actions/download-artifact@v4
        with:
          name: Yelly-Doramas-1.0.16
          path: base_artifact
          github-token: ${{ github.token }}
          run-id: 36098958751

      - name: Apply Yelly 1.0.20 native player test
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work out
          mkdir -p work out
          unzip -q base_artifact/Yelly_Doramas_Android_Nativo_1_0_16.zip -d work
          mkdir -p work/app/src/main/res/raw
          cp inspection/yelly_demo.mp4 work/app/src/main/res/raw/yelly_demo.mp4
          python3 inspection/patch_yelly_120_native_demo.py

          grep -q "versionName '1.0.20'" work/app/build.gradle
          grep -q 'R.raw.yelly_demo' work/app/src/main/java/fun/greenplay/app/StoriesActivity.java
          grep -q 'R.raw.yelly_demo' work/app/src/main/java/fun/greenplay/app/MainActivity.java
          grep -q 'new ExoPlayer.Builder' work/app/src/main/java/fun/greenplay/app/StoriesActivity.java
          grep -q 'new ExoPlayer.Builder' work/app/src/main/java/fun/greenplay/app/PlayerActivity.java
          test -s work/app/src/main/res/raw/yelly_demo.mp4
          if grep -q 'YouTubePlayerActivity' work/app/src/main/AndroidManifest.xml; then exit 1; fi
          if grep -q 'WebView' work/app/src/main/java/fun/greenplay/app/StoriesActivity.java; then exit 1; fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Compile Yelly
        run: cd work && gradle assembleDebug --stacktrace --no-daemon

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          cp work/app/build/outputs/apk/debug/app-debug.apk out/Yelly_Doramas_1.0.20.apk
          (cd work && zip -qr ../out/Yelly_Doramas_Android_Nativo_1_0_20.zip . -x '.gradle/*' 'app/build/*' 'build/*')
          unzip -t out/Yelly_Doramas_Android_Nativo_1_0_20.zip >/dev/null
          sha256sum out/*

      - uses: actions/upload-artifact@v4
        with:
          name: Yelly-Doramas-1.0.20
          path: out/*
          if-no-files-found: error
          retention-days: 30
