name: Build Yelly Doramas 1.0.17

on:
  push:
    paths:
      - '.github/workflows/build-yelly-117.yml'
      - 'inspection/patch_yelly_117_restore_hidden_ids.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Download Yelly 1.0.16 source
        uses: actions/download-artifact@v4
        with:
          name: Yelly-Doramas-1.0.16
          path: current_artifact
          github-token: ${{ github.token }}
          run-id: 36098958751

      - name: Download previous hidden-player source
        uses: actions/download-artifact@v4
        with:
          name: Yelly-Doramas-1.0.13
          path: old_artifact
          github-token: ${{ github.token }}
          run-id: 36092947244

      - name: Apply Yelly 1.0.17
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work oldsrc out
          mkdir -p work oldsrc out
          unzip -q current_artifact/Yelly_Doramas_Android_Nativo_1_0_16.zip -d work
          unzip -q old_artifact/Yelly_Doramas_Android_Nativo_1_0_13.zip -d oldsrc

          cp oldsrc/app/src/main/java/fun/greenplay/app/StoriesActivity.java work/app/src/main/java/fun/greenplay/app/StoriesActivity.java
          cp oldsrc/app/src/main/java/fun/greenplay/app/YouTubePlayerActivity.java work/app/src/main/java/fun/greenplay/app/YouTubePlayerActivity.java

          python3 inspection/patch_yelly_117_restore_hidden_ids.py

          grep -q "versionName '1.0.17'" work/app/build.gradle
          grep -q 'Api.post("greenshorts"' work/app/src/main/java/fun/greenplay/app/StoriesActivity.java
          grep -q 'iframe_api' work/app/src/main/java/fun/greenplay/app/StoriesActivity.java
          grep -q 'previewLimit=120' work/app/src/main/java/fun/greenplay/app/StoriesActivity.java
          grep -q 'Assistir agora' work/app/src/main/java/fun/greenplay/app/StoriesActivity.java
          grep -q 'story_banner_bg' work/app/src/main/java/fun/greenplay/app/StoriesActivity.java
          grep -q 'ytTopMask' work/app/src/main/java/fun/greenplay/app/StoriesActivity.java
          grep -q 'ytBrandMask' work/app/src/main/java/fun/greenplay/app/YouTubePlayerActivity.java
          grep -q 'new Intent(this,YouTubePlayerActivity.class)' work/app/src/main/java/fun/greenplay/app/MainActivity.java
          grep -q 'android:name=".YouTubePlayerActivity"' work/app/src/main/AndroidManifest.xml

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Compile Yelly
        run: cd work && gradle assembleDebug --stacktrace --no-daemon

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          cp work/app/build/outputs/apk/debug/app-debug.apk out/Yelly_Doramas_1.0.17.apk
          (cd work && zip -qr ../out/Yelly_Doramas_Android_Nativo_1_0_17.zip . -x '.gradle/*' 'app/build/*' 'build/*')
          unzip -t out/Yelly_Doramas_Android_Nativo_1_0_17.zip >/dev/null
          sha256sum out/*

      - uses: actions/upload-artifact@v4
        with:
          name: Yelly-Doramas-1.0.17
          path: out/*
          if-no-files-found: error
          retention-days: 30
