name: Inspect GreenPlay 5.28.70 Player Lifecycle

on:
  push:
    paths:
      - '.github/workflows/inspect-greenplay-52870-player-lifecycle.yml'

permissions:
  contents: write
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GreenPlay-5.28.70-exact-provider-counts
          path: base_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35829657433
      - shell: bash
        run: |
          set -euo pipefail
          rm -rf work && mkdir work
          unzip -q base_artifact/GreenPlay_Android_Nativo_5_28_52870_EXACT_PROVIDER_COUNTS.zip -d work
          {
            echo '=== PLAYER ==='
            grep -n -A70 -B15 -E 'void onCreate|void onResume|protected void onCreate|protected void onResume' work/app/src/main/java/fun/greenplay/app/PlayerActivity.java || true
            echo '=== YOUTUBE ==='
            grep -n -A50 -B10 -E 'void onCreate|void onResume|protected void onCreate|protected void onResume' work/app/src/main/java/fun/greenplay/app/YouTubePlayerActivity.java || true
          } > inspection/player_lifecycle_52870.txt
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add inspection/player_lifecycle_52870.txt
          git commit -m "Inspect player lifecycle 5.28.70" || exit 0
          git push
