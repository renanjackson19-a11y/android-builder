name: Inspect GreenPlay 5.28.70 Download Entry

on:
  push:
    paths:
      - '.github/workflows/inspect-greenplay-52870-download-entry.yml'

permissions:
  contents: write
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GreenPlay-5.28.70-exact-provider-counts
          path: base_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35829657433
      - shell: bash
        run: |
          set -euo pipefail
          rm -rf work && mkdir work
          unzip -q base_artifact/GreenPlay_Android_Nativo_5_28_52870_EXACT_PROVIDER_COUNTS.zip -d work
          grep -n -A80 -B20 -E 'void downloadOffline|downloadOfflineUrls|startForegroundService|OfflineDownloadService' work/app/src/main/java/fun/greenplay/app/MainActivity.java > inspection/download_entry_52870.txt || true
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add inspection/download_entry_52870.txt
          git commit -m "Inspect download entry 5.28.70" || exit 0
          git push
