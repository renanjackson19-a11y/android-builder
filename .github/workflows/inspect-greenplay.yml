name: Extract GreenPlay v16.82 sources
on:
  push:
    paths:
      - '.github/workflows/inspect-greenplay.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Extract current v16.82 source files
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile, os, shutil
          from pathlib import Path

          zpath='uploads/project-20260916-031008-938c1e.zip'
          wanted=[
            'README_V16_82_PLANOS_COMPACTOS_PIX_SEM_CPF_INICIAL.txt',
            'README_V16_81_PLANOS_REFERENCIA.txt',
            'README_V16_80_PLANOS_POR_REVENDA.txt',
            'app/build.gradle',
            'app/src/main/AndroidManifest.xml',
            'app/src/main/java/fun/greenplay/app/MainActivity.java',
            'app/src/main/java/fun/greenplay/app/Api.java',
          ]
          root=Path('inspection/v16_82')
          if root.exists(): shutil.rmtree(root)
          root.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(zpath) as z:
              names=set(z.namelist())
              for n in wanted:
                  if n in names:
                      dst=root/n
                      dst.parent.mkdir(parents=True,exist_ok=True)
                      dst.write_bytes(z.read(n))
              # Also copy any root README mentioning payment/plans/Pix/MisticPay.
              for n in z.namelist():
                  low=n.lower()
                  if '/' in n or not n.lower().endswith(('.txt','.md')):
                      continue
                  if any(k in low for k in ('pix','mistic','pagamento','plano','assinatura')):
                      dst=root/n
                      dst.parent.mkdir(parents=True,exist_ok=True)
                      dst.write_bytes(z.read(n))
          PY
      - name: Commit extracted sources
        shell: bash
        run: |
          git config user.name "GreenPlay Inspector"
          git config user.email "actions@users.noreply.github.com"
          git add inspection/v16_82
          git commit -m "Extract GreenPlay v16.82 payment sources" || exit 0
          git push
