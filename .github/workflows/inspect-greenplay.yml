name: Package GreenPlay v16.221

on:
  push:
    paths:
      - .github/workflows/inspect-greenplay.yml

permissions:
  contents: write

jobs:
  build_zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package source
        shell: bash
        run: |
          set -e
          rm -rf work
          mkdir -p work releases
          unzip -q uploads/project-20260919-000923-73d8cc.zip -d work
          test -f work/gp_v16220/app/src/main/java/fun/greenplay/app/MainActivity.java
          cp inspection/current/app/src/main/java/fun/greenplay/app/MainActivity.java work/gp_v16220/app/src/main/java/fun/greenplay/app/MainActivity.java
          sed -i "s/versionCode 231/versionCode 232/" work/gp_v16220/app/build.gradle
          sed -i "s/versionName '1.16.220.0'/versionName '1.16.221.0'/" work/gp_v16220/app/build.gradle
          printf '%s\n'             'GreenPlay v16.221 - correcoes finais'             ''             '- Loading unico no inicio e na troca celular/TV.'             '- Categorias da TV fixas a esquerda com rolagem independente.'             '- Grid de capas usando melhor a largura da TV.'             '- Favoritos e Downloads centralizados.'             '- Player TV corrigido para evitar lateral preta temporaria.'             '- Menu TV, Destaque, Filmes, Series e Favoritos maior.'             > work/gp_v16220/README_V16_221_CORRECOES_FINAIS.txt
          rm -f releases/GreenPlay_Android_Nativo_v16_221_CORRECOES_FINAIS.zip
          cd work
          zip -qr ../releases/GreenPlay_Android_Nativo_v16_221_CORRECOES_FINAIS.zip gp_v16220
          cd ..
          unzip -tq releases/GreenPlay_Android_Nativo_v16_221_CORRECOES_FINAIS.zip

      - name: Commit ZIP
        shell: bash
        run: |
          git config user.name "GreenPlay Builder"
          git config user.email "actions@users.noreply.github.com"
          git add releases/GreenPlay_Android_Nativo_v16_221_CORRECOES_FINAIS.zip
          git commit -m "GreenPlay v16.221 corrected source" || exit 0
          git push
