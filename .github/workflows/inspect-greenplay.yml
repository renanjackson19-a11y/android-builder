name: Package GreenPlay v16.221 final

on:
  push:
    paths:
      - '.github/workflows/inspect-greenplay.yml'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Assemble corrected source ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work
          mkdir -p work releases
          unzip -q uploads/project-20260919-000923-73d8cc.zip -d work

          python3 - <<'PY'
          from pathlib import Path
          mains=list(Path('work').glob('**/app/src/main/java/fun/greenplay/app/MainActivity.java'))
          if not mains:
              raise SystemExit('MainActivity not found in source ZIP')
          main=min(mains,key=lambda p:len(str(p)))
          project=main.parents[6]

          patched=Path('inspection/current/app/src/main/java/fun/greenplay/app/MainActivity.java')
          if not patched.exists():
              raise SystemExit('Patched MainActivity not found')
          main.write_bytes(patched.read_bytes())

          gradle=project/'app/build.gradle'
          g=gradle.read_text(encoding='utf-8')
          if "versionCode 231" in g:
              g=g.replace("versionCode 231","versionCode 232")
          if "versionName '1.16.220.0'" in g:
              g=g.replace("versionName '1.16.220.0'","versionName '1.16.221.0'")
          gradle.write_text(g,encoding='utf-8')

          (project/'README_V16_221_CORRECOES_FINAIS.txt').write_text(
          """GreenPlay v16.221 - correções finais

- Loading único e igual no início e na troca celular/TV; removida a tela "Tela ajustada".
- Textos de progresso de logos/EPG podem quebrar linha sem corte.
- Filmes, Séries e Kids na TV: categorias fixas à esquerda, com rolagem independente.
- Grid de capas usa a largura disponível para reduzir espaço vazio à direita.
- Favoritos e Downloads: opções Filmes/Séries/TV centralizadas e com largura igual.
- Player TV recebe relayout imediato/repetido ao entrar no modo cinema e ao fechar a lista para evitar a lateral preta temporária.
- Menu TV/Destaque/Filmes/Séries/Favoritos levemente maior.
- Mantidas as correções anteriores de foco, controle remoto, ANR, EPG, logos e navegação.
""",encoding='utf-8')
          print(project)
          PY

          rm -f releases/GreenPlay_Android_Nativo_v16_221_CORRECOES_FINAIS.zip
          (cd work && zip -qr ../releases/GreenPlay_Android_Nativo_v16_221_CORRECOES_FINAIS.zip .)
          test -s releases/GreenPlay_Android_Nativo_v16_221_CORRECOES_FINAIS.zip
          unzip -tq releases/GreenPlay_Android_Nativo_v16_221_CORRECOES_FINAIS.zip
          ls -lh releases/GreenPlay_Android_Nativo_v16_221_CORRECOES_FINAIS.zip

      - name: Commit final ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GreenPlay Builder"
          git config user.email "actions@users.noreply.github.com"
          git add releases/GreenPlay_Android_Nativo_v16_221_CORRECOES_FINAIS.zip
          git commit -m "GreenPlay v16.221 corrected source" || exit 0
          git push
