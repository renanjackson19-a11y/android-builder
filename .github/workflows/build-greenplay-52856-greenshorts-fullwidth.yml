name: Build GreenPlay 5.28.56 GreenShorts Full Width

on:
  push:
    paths:
      - '.github/workflows/build-greenplay-52856-greenshorts-fullwidth.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
      - name: Download 5.28.55 source
        uses: actions/download-artifact@v4
        with:
          name: GreenPlay-5.28.55-greenshorts-tv-icon
          path: base_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35793965373
      - name: Patch source
        shell: bash
        run: |
          set -euo pipefail
          mkdir work
          unzip -q base_artifact/GreenPlay_Android_Nativo_5_28_52855_GREENSHORTS_TV_ICON.zip -d work
          python3 inspection/patch52856_greenshorts_tv_fullwidth.py
          grep -q 'versionCode 52856' work/app/build.gradle
          grep -q 'screen-left-right' work/app/src/main/java/fun/greenplay/app/MainActivity.java
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Compile APK
        run: cd work && gradle assembleDebug --stacktrace --no-daemon
      - name: Package output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp work/app/build/outputs/apk/debug/app-debug.apk out/GreenPlay_5.28.56-debug.apk
          (cd work && zip -qr ../out/GreenPlay_Android_Nativo_5_28_52856_GREENSHORTS_FULLWIDTH.zip . -x '.gradle/*' 'app/build/*' 'build/*')
          unzip -t out/GreenPlay_Android_Nativo_5_28_52856_GREENSHORTS_FULLWIDTH.zip >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: GreenPlay-5.28.56-greenshorts-fullwidth
          path: out/*
          if-no-files-found: error
          retention-days: 30
