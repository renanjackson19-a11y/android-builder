name: Build GreenPlay 5.28.43 Loose GreenShorts

on:
  push:
    paths:
      - '.github/workflows/build-greenplay-52843-loose-greenshorts.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Download GreenPlay 5.28.42 source
        uses: actions/download-artifact@v4
        with:
          name: GreenPlay-5.28.42-greenshorts-provider
          path: base_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35706358452

      - name: Apply 5.28.43 patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work
          mkdir work
          unzip -q base_artifact/GreenPlay_Android_Nativo_5_28_52842_GREENSHORTS_PROVIDER.zip -d work
          python3 inspection/patch52843.py
          mkdir -p work/app/src/main/res/drawable-nodpi
          cp assets/greenshorts_fallback.jpg work/app/src/main/res/drawable-nodpi/greenshorts_fallback.jpg
          test -s work/app/src/main/res/drawable-nodpi/greenshorts_fallback.jpg
          grep -q 'versionCode 52843' work/app/build.gradle
          grep -q 'catalog52843_' work/app/src/main/java/fun/greenplay/app/MainActivity.java
          grep -q 'renderGreenShortsLooseSection' work/app/src/main/java/fun/greenplay/app/MainActivity.java
          ! grep -q 'addHomeTopMediaTab(tabs,R.drawable.top_shorts' work/app/src/main/java/fun/greenplay/app/MainActivity.java

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Compile APK
        shell: bash
        run: |
          set -euo pipefail
          cd work
          gradle assembleDebug --stacktrace --no-daemon

      - name: Package output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp work/app/build/outputs/apk/debug/app-debug.apk out/GreenPlay_5.28.43-debug.apk
          (cd work && zip -qr ../out/GreenPlay_Android_Nativo_5_28_52843_GREENSHORTS_SOLTO.zip . -x '.gradle/*' 'app/build/*' 'build/*')
          unzip -t out/GreenPlay_Android_Nativo_5_28_52843_GREENSHORTS_SOLTO.zip >/dev/null
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: GreenPlay-5.28.43-loose-greenshorts
          path: out/*
          if-no-files-found: error
          retention-days: 30
