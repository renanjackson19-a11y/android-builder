name: Package and validate GreenPlay v16.225

on:
  push:
    paths:
      - .github/workflows/package-v16-225.yml

permissions:
  contents: write
  actions: read

jobs:
  package_validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare GreenPlay v16.225
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work-v16225 releases/GreenPlay_Android_Nativo_v16_225_FOCO_CONTROLE_PLAYER_TV.zip
          mkdir -p work-v16225 releases
          unzip -q releases/GreenPlay_Android_Nativo_v16_224_DETALHE_SEMPRE_NO_TOPO.zip -d work-v16225
          test -d work-v16225/gp_v16224
          mv work-v16225/gp_v16224 work-v16225/gp_v16225
          cp inspection/current/app/src/main/java/fun/greenplay/app/MainActivity.java work-v16225/gp_v16225/app/src/main/java/fun/greenplay/app/MainActivity.java
          cp inspection/current/app/src/main/java/fun/greenplay/app/PlayerActivity.java work-v16225/gp_v16225/app/src/main/java/fun/greenplay/app/PlayerActivity.java
          sed -i "s/versionCode 235/versionCode 236/" work-v16225/gp_v16225/app/build.gradle
          sed -i "s/versionName '1.16.224.0'/versionName '1.16.225.0'/" work-v16225/gp_v16225/app/build.gradle
          grep -q "versionCode 236" work-v16225/gp_v16225/app/build.gradle
          grep -q "versionName '1.16.225.0'" work-v16225/gp_v16225/app/build.gradle
          printf '%s\n'             'GreenPlay v16.225 - foco visivel no controle do player da TV'             ''             '- Ao navegar com o controle remoto, o item selecionado recebe borda verde forte.'             '- O foco tambem ganha leve zoom e elevacao para ficar evidente.'             '- A faixa preta dos controles permanece visivel enquanto existe foco nela.'             '- Voltar 10s, play/pause, avancar 10s, Zoom/Ajustar/Preencher e barra de progresso mantem o foco visivel.'             '- Vale para filmes e series porque ambos usam o mesmo PlayerActivity.'             '- Mantidas todas as correcoes anteriores.'             > work-v16225/gp_v16225/README_V16_225_FOCO_PLAYER_TV.txt
          (cd work-v16225 && zip -qr ../releases/GreenPlay_Android_Nativo_v16_225_FOCO_CONTROLE_PLAYER_TV.zip gp_v16225)
          unzip -tq releases/GreenPlay_Android_Nativo_v16_225_FOCO_CONTROLE_PLAYER_TV.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile debug validation
        shell: bash
        run: |
          set -euo pipefail
          cd work-v16225/gp_v16225
          gradle assembleDebug --stacktrace --no-daemon

      - name: Commit full ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GreenPlay Builder"
          git config user.email "actions@users.noreply.github.com"
          git add releases/GreenPlay_Android_Nativo_v16_225_FOCO_CONTROLE_PLAYER_TV.zip
          git commit -m "GreenPlay v16.225 TV player focus fix" || exit 0
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: GreenPlay_Android_Nativo_v16_225_FOCO_CONTROLE_PLAYER_TV
          path: releases/GreenPlay_Android_Nativo_v16_225_FOCO_CONTROLE_PLAYER_TV.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
