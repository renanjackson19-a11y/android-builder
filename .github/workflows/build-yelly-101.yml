name: Build Yelly Doramas 1.0.1

on:
  push:
    paths:
      - '.github/workflows/build-yelly-101.yml'
      - 'inspection/patch_yelly_101.py'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
      - name: Download Yelly 1.0.0 source
        uses: actions/download-artifact@v4
        with:
          name: Yelly-Doramas-1.0.0
          path: base_artifact
          github-token: ${{ github.token }}
          run-id: 36056952915
      - name: Apply Yelly 1.0.1 fixes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work out
          unzip -q base_artifact/Yelly_Doramas_Android_Nativo_1_0_0.zip -d work
          python3 inspection/patch_yelly_101.py
          grep -q "versionName '1.0.1'" work/app/build.gradle
          grep -q 'greenplay_app_logo' work/app/src/main/java/fun/greenplay/app/MainActivity.java
          grep -q 'greenplay_app_background' work/app/src/main/java/fun/greenplay/app/MainActivity.java
          grep -q 'greenplay_primary_color' work/app/src/main/java/fun/greenplay/app/MainActivity.java
          grep -q 'String panelBg=bgUrl' work/app/src/main/java/fun/greenplay/app/MainActivity.java
          grep -q 'Api.m("identifier",id,"email",id' work/app/src/main/java/fun/greenplay/app/MainActivity.java
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Compile Yelly
        run: cd work && gradle assembleDebug --stacktrace --no-daemon
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          cp work/app/build/outputs/apk/debug/app-debug.apk out/Yelly_Doramas_1.0.1.apk
          (cd work && zip -qr ../out/Yelly_Doramas_Android_Nativo_1_0_1.zip . -x '.gradle/*' 'app/build/*' 'build/*')
          unzip -t out/Yelly_Doramas_Android_Nativo_1_0_1.zip >/dev/null
          sha256sum out/*
      - uses: actions/upload-artifact@v4
        with:
          name: Yelly-Doramas-1.0.1
          path: out/*
          if-no-files-found: error
          retention-days: 30
