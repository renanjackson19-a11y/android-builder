name: Build GreenPlay 5.28.83 Compact Centered Servers
# rerun after robust APK verification

on:
  push:
    paths:
      - '.github/workflows/build-greenplay-52883-compact-centered-servers.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Download GreenPlay 5.28.82 source
        uses: actions/download-artifact@v4
        with:
          name: GreenPlay-5.28.82-server-card-cleanup
          path: base_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35913608535

      - name: Apply compact centered server picker
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work out apkcheck
          mkdir -p work out
          unzip -q base_artifact/GreenPlay_Android_Nativo_5_28_52882_SERVER_CARDS.zip -d work
          python3 inspection/patch52883_compact_centered_servers.py

          grep -q 'versionCode 52883' work/app/build.gradle
          grep -q "versionName '5.28.83'" work/app/build.gradle
          grep -q 'Escolha a fonte que deseja usar' work/app/src/main/java/fun/greenplay/app/MainActivity.java
          grep -q 'providerContentLabel' work/app/src/main/java/fun/greenplay/app/MainActivity.java
          grep -q 'contentLine.setSingleLine(true)' work/app/src/main/java/fun/greenplay/app/MainActivity.java

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Compile APK
        run: cd work && gradle assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=work/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          mkdir -p apkcheck
          unzip -q "$APK" 'classes*.dex' -d apkcheck
          STRINGS=/tmp/allstrings.txt
          find apkcheck -name 'classes*.dex' -print0 | xargs -0 strings -a > "$STRINGS"
          # Positive UI checks were already performed against source before compilation.
          # DEX string extraction is not reliable for every UTF-8/R8 string, so only
          # security-sensitive negative checks are enforced here.
          if grep -Fq '454946ee403e82a9657eafc76091ccb6d8ccd4a8fadfca45' "$STRINGS"; then
            echo 'Plain API token leaked into DEX' >&2
            exit 1
          fi
          if grep -Eqi 'greenplay-media-proxy|/media/p/|:8770' "$STRINGS"; then
            echo 'Relay reference found in APK' >&2
            exit 1
          fi
          if command -v apkanalyzer >/dev/null 2>&1; then
            apkanalyzer manifest debuggable "$APK" | tee /tmp/debuggable.txt
            ! grep -qi '^true$' /tmp/debuggable.txt
          fi

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          cp work/app/build/outputs/apk/debug/app-debug.apk out/GreenPlay_5.28.83-COMPACT-SERVERS.apk
          (cd work && zip -qr ../out/GreenPlay_Android_Nativo_5_28_52883_COMPACT_SERVERS.zip . -x '.gradle/*' 'app/build/*' 'build/*')
          unzip -t out/GreenPlay_Android_Nativo_5_28_52883_COMPACT_SERVERS.zip >/dev/null
          sha256sum out/*

      - uses: actions/upload-artifact@v4
        with:
          name: GreenPlay-5.28.83-compact-centered-servers
          path: out/*
          if-no-files-found: error
          retention-days: 30
