name: Build GreenPlay 5.28.51 Player UI Clean

on:
  push:
    paths:
      - '.github/workflows/build-greenplay-52851-player-ui-clean.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Download GreenPlay 5.28.50 source
        uses: actions/download-artifact@v4
        with:
          name: GreenPlay-5.28.50-greenshorts-covers
          path: base_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35781569602

      - name: Apply 5.28.51 player UI clean patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work
          mkdir work
          unzip -q base_artifact/GreenPlay_Android_Nativo_5_28_52850_GREENSHORTS_CAPAS_CENTRALIZADAS.zip -d work
          python3 inspection/patch52851_mask_external_player_ui.py
          grep -q 'versionCode 52851' work/app/build.gradle
          grep -q 'topMaskH' work/app/src/main/java/fun/greenplay/app/YouTubePlayerActivity.java
          grep -q 'bottomMaskH' work/app/src/main/java/fun/greenplay/app/YouTubePlayerActivity.java

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Compile APK
        shell: bash
        run: |
          set -euo pipefail
          cd work
          gradle assembleDebug --stacktrace --no-daemon

      - name: Package output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp work/app/build/outputs/apk/debug/app-debug.apk out/GreenPlay_5.28.51-debug.apk
          (cd work && zip -qr ../out/GreenPlay_Android_Nativo_5_28_52851_PLAYER_UI_CLEAN.zip . -x '.gradle/*' 'app/build/*' 'build/*')
          unzip -t out/GreenPlay_Android_Nativo_5_28_52851_PLAYER_UI_CLEAN.zip >/dev/null
          sha256sum out/GreenPlay_5.28.51-debug.apk
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: GreenPlay-5.28.51-player-ui-clean
          path: out/*
          if-no-files-found: error
          retention-days: 30
