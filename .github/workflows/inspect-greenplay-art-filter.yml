name: Inspect GreenPlay Art Filter

on:
  push:
    paths:
      - '.github/workflows/inspect-greenplay-art-filter.yml'

permissions:
  contents: write
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GreenPlay-5.28.66-universal-stream-formats
          path: base_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35819940050
      - shell: bash
        run: |
          set -euo pipefail
          rm -rf work && mkdir work
          unzip -q base_artifact/GreenPlay_Android_Nativo_5_28_52866_UNIVERSAL_STREAM_FORMATS.zip -d work
          grep -n -A40 -B20 'void stripUnverifiedCatalogArt' work/app/src/main/java/fun/greenplay/app/MainActivity.java > inspection/art_filter_52866.txt || true
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add inspection/art_filter_52866.txt
          git commit -m "Inspect catalog art filter" || exit 0
          git push
