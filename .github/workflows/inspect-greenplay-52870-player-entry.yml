name: Inspect GreenPlay 5.28.70 Player Entry

on:
  push:
    paths:
      - '.github/workflows/inspect-greenplay-52870-player-entry.yml'

permissions:
  contents: write
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: GreenPlay-5.28.70-exact-provider-counts
          path: base_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35829657433
      - shell: bash
        run: |
          set -euo pipefail
          rm -rf work && mkdir work
          unzip -q base_artifact/GreenPlay_Android_Nativo_5_28_52870_EXACT_PROVIDER_COUNTS.zip -d work
          {
            echo '=== PLAYER STARTS ==='
            grep -RIn -E 'startActivity\(|PlayerActivity|tvStartInlineSource|setMediaItem|video_320|playUrl|streamUrl' work/app/src/main/java/fun/greenplay/app | head -n 700 || true
            echo '=== MANIFEST ==='
            cat work/app/src/main/AndroidManifest.xml
          } > inspection/player_entry_52870.txt
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add inspection/player_entry_52870.txt
          git commit -m "Inspect player entry points 5.28.70" || exit 0
          git push
