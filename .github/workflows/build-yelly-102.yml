name: Build Yelly Doramas 1.0.2

on:
  push:
    paths:
      - '.github/workflows/build-yelly-102.yml'
      - 'inspection/patch_yelly_102_palette.py'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
      - name: Download Yelly 1.0.1 source
        uses: actions/download-artifact@v4
        with:
          name: Yelly-Doramas-1.0.1
          path: base_artifact
          github-token: ${{ github.token }}
          run-id: 36070593596
      - name: Apply Yelly 1.0.2 palette
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work out
          unzip -q base_artifact/Yelly_Doramas_Android_Nativo_1_0_1.zip -d work
          python3 inspection/patch_yelly_102_palette.py
          grep -q "versionName '1.0.2'" work/app/build.gradle
          if grep -RInE '0xff0d1712|0xff101a15|0xff101713|0xff111a15|0xff0b1711|0xff06140d' work/app/src/main/java/fun/greenplay/app/MainActivity.java; then
            echo "Green palette literals still present"
            exit 1
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Compile Yelly
        run: cd work && gradle assembleDebug --stacktrace --no-daemon
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          cp work/app/build/outputs/apk/debug/app-debug.apk out/Yelly_Doramas_1.0.2.apk
          (cd work && zip -qr ../out/Yelly_Doramas_Android_Nativo_1_0_2.zip . -x '.gradle/*' 'app/build/*' 'build/*')
          unzip -t out/Yelly_Doramas_Android_Nativo_1_0_2.zip >/dev/null
          sha256sum out/*
      - uses: actions/upload-artifact@v4
        with:
          name: Yelly-Doramas-1.0.2
          path: out/*
          if-no-files-found: error
          retention-days: 30
