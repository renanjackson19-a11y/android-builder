name: Inspect GreenPlay 5.28.63 Catalog Playback

on:
  push:
    paths:
      - '.github/workflows/inspect-greenplay-52863-catalog-playback.yml'

permissions:
  contents: write
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GreenPlay-5.28.63-live-hls-ts-fallback
          path: base_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35808823242
      - shell: bash
        run: |
          set -euo pipefail
          rm -rf work
          mkdir work
          unzip -q base_artifact/GreenPlay_Android_Nativo_5_28_52863_HLS_TS_FALLBACK.zip -d work
          {
            echo '=== live paging ==='
            grep -nE 'get_channel|has_more|next_offset|liveOffset|loadLive|fetchLive|channelChunk|liveListHost' work/app/src/main/java/fun/greenplay/app/MainActivity.java || true
            echo
            echo '=== image/logo ==='
            grep -nE 'stream_icon|channel.*logo|logo.*channel|loadImage|imageUrl|tvg' work/app/src/main/java/fun/greenplay/app/MainActivity.java | head -n 260 || true
            echo
            echo '=== player ==='
            nl -ba work/app/src/main/java/fun/greenplay/app/PlayerActivity.java | sed -n '27,110p'
          } > inspection/catalog_playback_52863.txt
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add inspection/catalog_playback_52863.txt
          git commit -m "Inspect 5.28.63 catalog paging and playback" || exit 0
          git push
