name: Build GreenPlay 5.28.35 Complete Catalog

on:
  push:
    paths:
      - '.github/workflows/build-greenplay-52835-complete-catalog.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Prepare GreenPlay 5.28.35
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 \
            https://raw.githubusercontent.com/renanjackson19-a11y/android-builder/1c647610b6d6863016e9501d5ccc4d1bf482dce0/uploads/project-20260922-001053-d98d13.zip \
            -o /tmp/base52834.zip
          rm -rf work && mkdir work
          unzip -q /tmp/base52834.zip -d work

          python3 - <<'PY'
          from pathlib import Path

          p=Path('work/app/src/main/java/fun/greenplay/app/MainActivity.java')
          s=p.read_text()

          repls=[
          (
          'Map<String,String> categoryPageArgs(int typeId,String categoryId,int page,int offset){String contentType=typeId==2?"series":"movie";return Api.m("user_id",uid,"type",contentType,"category_id",categoryId,"page_no",String.valueOf(page),"page",String.valueOf(page),"offset",String.valueOf(Math.max(0,offset)),"limit","5000","per_page","5000","page_size","5000","full_catalog","1","all","1");}',
          'Map<String,String> categoryPageArgs(int typeId,String categoryId,int page,int offset){String contentType=typeId==2?"series":"movie";return Api.m("user_id",uid,"type",contentType,"category_id",categoryId,"page_no",String.valueOf(page),"page",String.valueOf(page),"offset",String.valueOf(Math.max(0,offset)),"limit","120","per_page","120","page_size","120","full_catalog","0");}'
          ),
          (
          'Api.post("content_by_category",Api.m("user_id",uid,"type",contentType,"category_id",cid,"page_no","1","page","1","offset","0","limit","5000","per_page","5000","full_catalog","1"),new Api.CB(){public void ok(JSONObject j){',
          'Api.post("content_by_category",Api.m("user_id",uid,"type",contentType,"category_id",cid,"page_no","1","page","1","offset","0","limit","24","per_page","24","page_size","24","full_catalog","0"),new Api.CB(){public void ok(JSONObject j){'
          ),
          (
          'Api.post("content_by_category",Api.m("user_id",uid,"type","movie","category_id",fcid,"page_no","1","page","1","offset","0","limit","5000","per_page","5000","page_size","5000","full_catalog","1"),new Api.CB(){',
          'Api.post("content_by_category",Api.m("user_id",uid,"type","movie","category_id",fcid,"page_no","1","page","1","offset","0","limit","24","per_page","24","page_size","24","full_catalog","0"),new Api.CB(){'
          ),
          (
          'sec.put("data",rows);sec.put("category_complete",1);saveHomeCache(cache);return;',
          'sec.put("category_total",rows==null?0:rows.length());sec.remove("category_complete");saveHomeCache(cache);return;'
          ),
          (
          'try{sec.put("data",merged);sec.put("category_complete",1);sec.put("category_total",merged.length());}catch(Exception ignored){}',
          'try{sec.put("category_total",merged.length());sec.remove("category_complete");}catch(Exception ignored){}'
          ),
          (
          'if(mainScroll!=null)mainScroll.setOnScrollChangeListener((v,sx,sy,ox,oy)->{if(gen!=viewGen||mobileCategoryGrid!=g)return;int remaining=body==null?0:body.getHeight()-(sy+mainScroll.getHeight());if(remaining<dp(900))maybeLoadMoreMobileCategory(false);});',
          'if(mainScroll!=null)mainScroll.setOnScrollChangeListener((v,sx,sy,ox,oy)->{if(gen!=viewGen||mobileCategoryGrid!=g)return;int remaining=body==null?0:body.getHeight()-(sy+mainScroll.getHeight());if(remaining<dp(1200))maybeLoadMoreMobileCategory(false);});'
          ),
          (
          'int start=mobileCategoryNextIndex,end=Math.min(mobileCategoryRows.length(),start+36),h=dp(196);',
          'int start=mobileCategoryNextIndex,end=Math.min(mobileCategoryRows.length(),start+48),h=dp(196);'
          )
          ]

          for old,new in repls:
              if old not in s:
                  raise SystemExit('target not found: '+old[:90])
              s=s.replace(old,new,1)

          p.write_text(s)

          b=Path('work/app/build.gradle')
          oldb=b.read_text()
          t=oldb.replace('versionCode 52834','versionCode 52835').replace("versionName '5.28.34'","versionName '5.28.35'")
          if t==oldb:
              raise SystemExit('version target not found')
          b.write_text(t)

          s=p.read_text()
          assert '"limit","120"' in s
          assert '"limit","24"' in s
          assert 'start+48' in s
          assert 'rows==null?0:rows.length()' in s
          assert 'sec.put("data",merged)' not in s
          assert 'versionCode 52835' in b.read_text()
          print('5.28.35 source prepared')
          PY

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Compile debug
        shell: bash
        run: |
          set -euo pipefail
          cd work
          gradle assembleDebug --stacktrace --no-daemon

      - name: Package complete source
        shell: bash
        run: |
          set -euo pipefail
          cd work
          zip -qr ../GreenPlay_Android_Nativo_5_28_52835_CATALOGO_COMPLETO_ESTAVEL.zip . \
            -x '.gradle/*' 'app/build/*' 'build/*'
          cp app/build/outputs/apk/debug/app-debug.apk ../GreenPlay_5.28.35-debug.apk
          unzip -t ../GreenPlay_Android_Nativo_5_28_52835_CATALOGO_COMPLETO_ESTAVEL.zip >/dev/null
          ls -lh ../GreenPlay_Android_Nativo_5_28_52835_CATALOGO_COMPLETO_ESTAVEL.zip ../GreenPlay_5.28.35-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GreenPlay-5.28.35-complete-catalog
          path: |
            GreenPlay_Android_Nativo_5_28_52835_CATALOGO_COMPLETO_ESTAVEL.zip
            GreenPlay_5.28.35-debug.apk
          if-no-files-found: error
          retention-days: 14
