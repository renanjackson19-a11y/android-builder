name: Build GreenPlay 5.28.52 GreenShorts Same Pattern

on:
  push:
    paths:
      - '.github/workflows/build-greenplay-52852-greenshorts-pattern.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Download GreenPlay 5.28.51 source
        uses: actions/download-artifact@v4
        with:
          name: GreenPlay-5.28.51-player-ui-clean
          path: base_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35782981941

      - name: Apply 5.28.52 patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work
          mkdir work
          unzip -q base_artifact/GreenPlay_Android_Nativo_5_28_52851_PLAYER_UI_CLEAN.zip -d work
          cat > /tmp/p.b64 <<'EOF'

EOF
          base64 -d /tmp/p.b64 | gzip -dc > /tmp/greenplay_52852.patch
          patch -d work -p1 < /tmp/greenplay_52852.patch
          grep -q 'versionCode 52852' work/app/build.gradle
          grep -q 'mobileCategoryGreenShorts=true' work/app/src/main/java/fun/greenplay/app/MainActivity.java
          grep -q 'Continuar GreenShorts' work/app/src/main/java/fun/greenplay/app/MainActivity.java
          grep -q 'greenshorts_resume_' work/app/src/main/java/fun/greenplay/app/YouTubePlayerActivity.java

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Compile APK
        shell: bash
        run: |
          set -euo pipefail
          cd work
          gradle assembleDebug --stacktrace --no-daemon

      - name: Package output
        shell: bash
        run: |
          set -euo pipefail
          cat > work/README_GREENPLAY_5_28_52852.txt <<'EOF'
GreenPlay 5.28.52
- GreenShorts sem categorias, no mesmo padrão de carregamento de Filmes/Séries.
- Primeiros itens aparecem assim que a primeira página chega; próximas páginas carregam ao rolar.
- Rodapé "Carregando mais conteúdo..." igual ao catálogo.
- Capas voltaram ao mesmo enquadramento de Filmes/Séries.
- Player GreenShorts continua vertical.
- GreenShorts salva progresso e mostra Continuar assistindo / Assistir do início.
- Filmes e Séries não foram alterados.
EOF
          mkdir -p out
          cp work/app/build/outputs/apk/debug/app-debug.apk out/GreenPlay_5.28.52-debug.apk
          (cd work && zip -qr ../out/GreenPlay_Android_Nativo_5_28_52852_GREENSHORTS_PADRAO.zip . -x '.gradle/*' 'app/build/*' 'build/*')
          unzip -t out/GreenPlay_Android_Nativo_5_28_52852_GREENSHORTS_PADRAO.zip >/dev/null
          sha256sum out/GreenPlay_5.28.52-debug.apk
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: GreenPlay-5.28.52-greenshorts-pattern
          path: out/*
          if-no-files-found: error
          retention-days: 30
