name: Validate GreenPlay 5.28.34 Provider Return

on:
  push:
    paths:
      - '.github/workflows/build-greenplay-52834-provider-return.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
      - name: Prepare fixed 5.28.34
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2             https://raw.githubusercontent.com/renanjackson19-a11y/android-builder/b249a4153e2d626422639dcdc7f3d1439ecda257/uploads/project-20260921-234805-ae4fe1.zip             -o /tmp/base52833.zip
          rm -rf work && mkdir work
          unzip -q /tmp/base52833.zip -d work
          python3 - <<'PY'
          from pathlib import Path
          root=Path('work')
          ma=root/'app/src/main/java/fun/greenplay/app/MainActivity.java'
          s=ma.read_text()
          old='void cancelProviderSwitch(){\n  providerSwitchScreen=false;\n  shell();\n  if(contentFrame!=null&&mainScroll==homeScrollCache)leaveHomeForPage();\n  profile();\n }'
          new='void cancelProviderSwitch(){\n  providerSwitchScreen=false;\n  requestedStartNav=4;\n  shell();\n }'
          assert old in s
          s=s.replace(old,new,1)
          ma.write_text(s)
          bg=root/'app/build.gradle'
          t=bg.read_text().replace('versionCode 52833','versionCode 52834').replace("versionName '5.28.33'","versionName '5.28.34'")
          bg.write_text(t)
          assert 'requestedStartNav=4;' in ma.read_text()
          assert 'versionCode 52834' in t
          print('prepared 5.28.34')
          PY
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Compile debug
        shell: bash
        run: |
          set -euo pipefail
          cd work
          gradle assembleDebug --stacktrace --no-daemon
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd work && zip -qr ../dist/GreenPlay_Android_Nativo_5_28_52834_CORRIGE_VOLTA_ALTERAR_SERVIDOR.zip .)
          cp work/app/build/outputs/apk/debug/app-debug.apk dist/GreenPlay_5.28.34_DEBUG.apk
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: GreenPlay-5.28.34-provider-return-fix
          path: dist/*
          if-no-files-found: error
