name: Inspect GreenPlay 5.28.34 Category Paging

on:
  push:
    paths:
      - '.github/workflows/inspect-greenplay-52834-category-paging.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 \
            https://raw.githubusercontent.com/renanjackson19-a11y/android-builder/1c647610b6d6863016e9501d5ccc4d1bf482dce0/uploads/project-20260922-001053-d98d13.zip \
            -o /tmp/p.zip
          rm -rf work && mkdir work
          unzip -q /tmp/p.zip -d work
          F=work/app/src/main/java/fun/greenplay/app/MainActivity.java
          echo '===== METHODS ====='
          grep -nE "fetchAllCategoryPages|maybeLoadMoreMobileCategory|openSection|openCategory|renderExplore|category_complete|category_total|first_pages_complete|content_by_category|mobileCategoryRows|mobileCategoryNext|full_catalog" "$F" | head -n 280
          echo '===== 1450-1575 ====='
          sed -n '1450,1575p' "$F"
          echo '===== 1180-1450 ====='
          sed -n '1180,1450p' "$F"
