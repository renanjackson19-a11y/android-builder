name: Build GreenPlay 5.28.94 Football Fast Load

on:
  push:
    paths:
      - '.github/workflows/build-greenplay-52894-football-fast-load.yml'
      - 'inspection/patch52894_football_fast_load.py'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Download GreenPlay 5.28.93 source
        uses: actions/download-artifact@v4
        with:
          name: GreenPlay-5.28.93-football-compact-ui
          path: base_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36015675441

      - name: Apply fast football loading
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work out
          mkdir -p work out
          unzip -q base_artifact/GreenPlay_Android_Nativo_5_28_52893_FOOTBALL_COMPACT_UI.zip -d work
          python3 inspection/patch52894_football_fast_load.py
          grep -q 'versionCode 52894' work/app/build.gradle
          grep -q "versionName '5.28.94'" work/app/build.gradle
          grep -q 'prefetchFootballToday' work/app/src/main/java/fun/greenplay/app/MainActivity.java
          grep -q 'footballCachedRows' work/app/src/main/java/fun/greenplay/app/MainActivity.java
          grep -q 'footballSelectedDate' work/app/src/main/java/fun/greenplay/app/MainActivity.java

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Compile APK
        run: cd work && gradle assembleDebug --stacktrace --no-daemon

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          cp work/app/build/outputs/apk/debug/app-debug.apk out/GreenPlay_5.28.94-FOOTBALL-FAST-LOAD.apk
          (cd work && zip -qr ../out/GreenPlay_Android_Nativo_5_28_52894_FOOTBALL_FAST_LOAD.zip . -x '.gradle/*' 'app/build/*' 'build/*')
          unzip -t out/GreenPlay_Android_Nativo_5_28_52894_FOOTBALL_FAST_LOAD.zip >/dev/null
          sha256sum out/*

      - uses: actions/upload-artifact@v4
        with:
          name: GreenPlay-5.28.94-football-fast-load
          path: out/*
          if-no-files-found: error
          retention-days: 30
