name: Build Yelly Doramas 1.0.31

on:
  push:
    paths:
      - '.github/workflows/build-yelly-131.yml'
      - 'inspection/patch_yelly_131_search_fix.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Download Yelly 1.0.30 source
        uses: actions/download-artifact@v4
        with:
          name: Yelly-Doramas-1.0.30
          path: base_artifact
          github-token: ${{ github.token }}
          run-id: 36137483721

      - name: Apply search fix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work out
          mkdir -p work out
          unzip -q base_artifact/Yelly_Doramas_Android_Nativo_1_0_30.zip -d work
          python3 inspection/patch_yelly_131_search_fix.py
          grep -q "versionName '1.0.31'" work/app/build.gradle
          grep -q 'Api.post("greenshorts"' work/app/src/main/java/fun/greenplay/app/MainActivity.java
          grep -q 'searchNorm' work/app/src/main/java/fun/greenplay/app/MainActivity.java
          if grep -q 'Api.post("search_catalog"' work/app/src/main/java/fun/greenplay/app/MainActivity.java; then
            echo 'old search endpoint still present' >&2
            exit 1
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Compile Yelly
        run: cd work && gradle assembleDebug --stacktrace --no-daemon

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          cp work/app/build/outputs/apk/debug/app-debug.apk out/Yelly_Doramas_1.0.31.apk
          (cd work && zip -qr ../out/Yelly_Doramas_Android_Nativo_1_0_31.zip . -x '.gradle/*' 'app/build/*' 'build/*')
          unzip -t out/Yelly_Doramas_Android_Nativo_1_0_31.zip >/dev/null
          sha256sum out/*

      - uses: actions/upload-artifact@v4
        with:
          name: Yelly-Doramas-1.0.31
          path: out/*
          if-no-files-found: error
          retention-days: 30
